<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AgentFlow 시각51 A 맥락 아틀라스</title><style>:root{
 --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","WenQuanYi Zen Hei",system-ui,sans-serif;
 --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang","Source Han Serif K",Georgia,serif;
 --mono:"D2Coding","JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
 /* 게임: 따뜻한 종이와 등불 */
 --g-paper:#f3ede1; --g-field:#fbf8f2; --g-stratum:#e9dfcb; --g-grp:#f3ecdd; --g-ink:#25221d; --g-ink2:#4f4a41; --g-ink3:#7d766a;
 --g-line:#3a352d; --amber:#b0601a; --amber-soft:#f1dcc1; --voice:#8a3f12; --voice-soft:#f5e3cf;
 --slate:#3e5a73; --slate-soft:#e4eaf0; --obs:#8b8a86;
 /* 서비스: 차가운 단면 */
 --b-paper:#edf0f3; --b-L1:#ffffff; --b-L2:#e6ebf0; --b-L3:#d7dfe7; --b-ink:#16202b; --b-ink2:#435160; --b-ink3:#6f7c8a; --teal:#0e6a73; --teal-soft:#d9eef0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--g-paper);color:var(--g-ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body:has(#s4.on){background:var(--b-paper)}
.nav{height:40px;display:flex;align-items:center;gap:28px;padding:0 24px;border-bottom:1px solid rgba(37,34,29,.14);background:rgba(255,255,255,.55);font-size:13px;white-space:nowrap}
.brand{font-weight:700;letter-spacing:-.01em;color:var(--g-ink)}
.nav nav{display:flex;gap:4px}
.nav a{color:var(--g-ink2);text-decoration:none;padding:11px 10px 10px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--g-ink)}
.nav a.on{color:var(--g-ink);border-bottom-color:var(--g-ink);font-weight:600}
.nav a:focus-visible{outline:2px solid var(--g-ink);outline-offset:-2px}
.note{margin-left:auto;color:var(--g-ink3)}
main{height:calc(100vh - 40px);position:relative}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.board{display:block;width:100%;height:100%}
svg text{font-family:var(--sans)}

/* ---------- 공통 문자 ---------- */
.h1{font:700 28px var(--serif);fill:var(--g-ink);letter-spacing:-.01em}
.bh1{font:700 26px var(--sans);fill:var(--b-ink);letter-spacing:-.02em}
.hsub{font-size:14px;fill:var(--g-ink3)}
.thesis{font-size:15px;fill:var(--g-ink2)}
.crumb{font-size:13px;fill:var(--g-ink3);letter-spacing:.02em}
.lgt{font-size:13px;fill:var(--g-ink2)}
.rh{font:700 20px var(--serif);fill:var(--g-ink)}
.rh2{font:700 17px var(--serif);fill:var(--g-ink)}
.gh{font:700 16px var(--serif);fill:var(--g-ink)}
.sh{font:700 17px var(--serif);fill:var(--g-ink)}
.sh2{font:700 14px var(--serif);fill:var(--g-ink3)}
.cnt{font-size:13px;fill:var(--g-ink3)}
.rd{font-size:14px;fill:var(--g-ink2)}
.rd2{font-size:13.5px;fill:var(--g-ink2)}
.body{font-size:14.5px;fill:var(--g-ink)}
.body15{font-size:15.5px;fill:var(--g-ink);font-weight:500}
.meta{font-size:12.5px;fill:var(--g-ink3)}
.cap{font-size:13px;font-weight:700;fill:var(--g-ink3);letter-spacing:.02em}
.tag{font-size:12.5px;fill:var(--g-ink3);font-style:italic}
.nm{font-size:15px;font-weight:600;fill:var(--g-ink)}
.nm16{font-size:16px;font-weight:700;fill:var(--g-ink)}
.nm17{font-size:17px;font-weight:700;fill:var(--g-ink)}
.ls{font-size:12.5px;fill:var(--g-ink2)}
.rv{font-size:12.5px;fill:var(--g-ink2);paint-order:stroke;stroke:var(--g-paper);stroke-width:3px;stroke-linejoin:round}
.quote{font:italic 13.5px var(--serif);fill:var(--voice)}
.q14{font-size:14px}
.qg{font:700 20px var(--serif);fill:var(--voice)}
.unk{font-size:12.5px;fill:var(--g-ink3)}
.amber{fill:var(--amber)}
.hair{stroke:rgba(37,34,29,.16);stroke-width:1;fill:none}
.hair.dot{stroke-dasharray:1.5 3;stroke:rgba(37,34,29,.35)}

/* 범례 */
.lg-solid{fill:var(--g-field);stroke:var(--g-line);stroke-width:1.2}
.lg-idea{fill:none;stroke:var(--g-ink3);stroke-width:1.2;stroke-dasharray:4 3}
.lg-share{fill:url(#hatch);stroke:var(--amber);stroke-width:1.2}

/* ---------- 게임 면 ---------- */
.board.g{background:var(--g-paper)}
.rg{fill:var(--g-field);stroke:var(--g-line);stroke-width:1.2}
.rg.idea{fill:none;stroke:var(--g-ink3);stroke-dasharray:5 4}
.stratum{fill:var(--g-stratum);stroke:none}
.grp{fill:var(--g-grp);stroke:rgba(58,53,45,.45);stroke-width:1}
.inner{fill:var(--g-field);stroke:var(--g-line);stroke-width:1.8}
.lot .lb{fill:#fffdf9;stroke:rgba(58,53,45,.55);stroke-width:1}
.lot.idea .lb{fill:none;stroke:var(--g-ink3);stroke-dasharray:4 3}
.lot.idea .nm{fill:var(--g-ink2);font-weight:500}
.lot.loopnode .lb{stroke:var(--amber);stroke-width:1.4}
.lot.share .lb{fill:#fffaf2;stroke:var(--amber);stroke-width:1.4}
.lot .hatch{fill:url(#hatch);stroke:none;opacity:.55}
.lot.share text{paint-order:stroke;stroke:#fffaf2;stroke-width:3.5px;stroke-linejoin:round}
.lot.fold .lb.back{fill:var(--g-grp)}
.lot.outer .lb{fill:transparent;stroke:rgba(58,53,45,.5)}
.lot.muted .lb{fill:transparent;stroke:rgba(58,53,45,.35)}
.lot.muted .nm{fill:var(--g-ink2);font-weight:500;font-size:14px}
.lot.big .lb{fill:#fffdf9;stroke:rgba(58,53,45,.6)}
.lot.unset .lb{fill:transparent;stroke:var(--g-ink3);stroke-dasharray:1.5 3}
.lot.unset .nm{fill:var(--g-ink2)}
.rel{fill:none;stroke:var(--g-ink2);stroke-width:1.1}
.loop{fill:none;stroke:var(--amber);stroke-width:1.8}

/* 장면03의 세 목소리 */
.voice{fill:var(--voice)}
.rep{fill:var(--slate)}
.obs{fill:var(--obs)}
.bigq{font:500 24px var(--serif);fill:var(--voice);letter-spacing:-.01em}
.scope-on{fill:var(--voice-soft);stroke:var(--voice);stroke-width:1.3}
.scope-open{fill:transparent;stroke:var(--g-ink3);stroke-width:1.2;stroke-dasharray:2 3}
.who{font-size:13px;font-weight:700}
.brk{fill:none;stroke:var(--slate);stroke-width:2}
.repl{fill:none;stroke:var(--slate);stroke-width:1.4}
.slip{fill:var(--slate-soft);stroke:none}
.slip-rule{stroke:var(--slate);stroke-width:3}
.mono{font:500 15px var(--mono);fill:#1f3346}
.instr{fill:rgba(255,255,255,.35);stroke:#c9c5bc;stroke-width:1}
.axis{stroke:#b9b6ae;stroke-width:1;fill:none}
.none{font-size:20px;font-weight:600;fill:var(--obs);letter-spacing:.04em}
.obs-dot{fill:none;stroke:var(--obs);stroke-width:1.3}

/* 위치 표시 */
.loc .lr{fill:var(--g-field);stroke:rgba(58,53,45,.45);stroke-width:.8}
.loc .lr.idea{fill:none;stroke-dasharray:2 2}
.loc .ls2{fill:var(--g-stratum)}
.loc .here{fill:var(--amber);opacity:.85}

/* ---------- 서비스 면 ---------- */
.board.b{background:var(--b-paper)}
.b .hsub,.b .meta{fill:var(--b-ink3)}
.b .thesis,.b .rd,.b .ls{fill:var(--b-ink2)}
.b .cap{fill:var(--b-ink3)}
.b .nm{fill:var(--b-ink)}
.b .rv{fill:var(--b-ink2);stroke:var(--b-L2)}
.b .unk{fill:var(--b-ink3)}
.L1{fill:var(--b-L1);stroke:rgba(22,32,43,.12)}
.L2{fill:var(--b-L2)}
.L3{fill:var(--b-L3)}
.band{font-size:13px;font-weight:700;fill:var(--b-ink3);letter-spacing:.06em}
.slab{fill:none;stroke:rgba(22,32,43,.28);stroke-width:1}
.slab.share{stroke:var(--teal);stroke-dasharray:6 3;stroke-width:1.2}
.slabh{font-size:13px;font-weight:700;fill:var(--b-ink2)}
.atag{font-size:12px;fill:var(--b-ink3);letter-spacing:.02em}
.blot .lb{fill:#fff;stroke:rgba(22,32,43,.5);stroke-width:1}
.blot.focus .lb{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.6}
.blot.focus-d .lb{fill:#fff;stroke:var(--teal);stroke-width:1.3}
.focus-t{fill:var(--teal)!important;font-weight:600}
.bgrp{fill:rgba(255,255,255,.35);stroke:rgba(22,32,43,.3);stroke-width:1}
.gh2{font-size:14px;font-weight:700;fill:var(--b-ink)}
.brel{fill:none;stroke:var(--b-ink2);stroke-width:1.1}
.frel{fill:none;stroke:var(--teal);stroke-width:2}
.bq{font-size:15px;font-weight:600;fill:var(--b-ink)}
.b .hair{stroke:rgba(22,32,43,.16)}
</style></head><body><header class="nav"><span class="brand">AgentFlow 시각51 A 맥락 아틀라스</span><nav><a href="#s1" data-i="0" title="등불길은 무엇으로 이루어지고, 어떻게 다시 출발하는가">01 게임 개요</a><a href="#s2" data-i="1" title="지도 기록 안쪽과, 그것에 기대는 바깥은 무엇인가">02 지도 기록 맥락</a><a href="#s3" data-i="2" title="사용자가 바란 범위와 돌아온 보고 사이에 무엇이 비어 있는가">03 원했던 범위와 보고</a><a href="#s4" data-i="3" title="손님이 보는 확정과 실제 성립하는 확정은 어디서 갈라지는가">04 예약 서비스</a></nav><span class="note">합성 설계 자료 · 실제 대화·실행 기록이 아님</span></header><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#b0601a" stroke-width="1.4"/></pattern><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#b0601a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#4f4a41" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="m-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#3e5a73" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#0e6a73" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="m-bink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#435160" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker></defs></svg><main><section class="scene" id="s1" aria-label="01 게임 개요"><svg class="board g" viewBox="0 0 1280 680" role="img" aria-labelledby="s1t"><title id="s1t">등불길 게임 개요</title><text x="40" y="46" class="h1">등불길</text><text x="132" y="46" class="hsub">탐험 게임 구상 · 영역 6 · 분류 전 구절 3</text><text x="40" y="76" class="thesis">등불이 꺼지면 마을로 돌아와 다시 나간다. 실패 뒤 무엇이 남는지는 맨 아래 진행 저장이 쥐고 있다.</text><rect x="742" y="35" width="18" height="12" class="lg-solid" rx="3"/><text x="766" y="46" class="lgt">영역 · 부분</text><rect x="846" y="35" width="18" height="12" class="lg-idea" rx="3"/><text x="870" y="46" class="lgt">구상</text><rect x="908" y="35" width="18" height="12" class="lg-share" rx="3"/><text x="932" y="46" class="lgt">함께 쓰는 접점</text><text x="1030" y="50" class="qg">“</text><text x="1044" y="46" class="lgt">사용자의 말</text><path d="M1120 41 H1140" class="loop" marker-end="url(#m-amber)"/><text x="1148" y="46" class="lgt">구상한 순환</text><rect x="40" y="96" width="412" height="302" class="rg" rx="12"/><rect x="468" y="96" width="360" height="148" class="rg" rx="12"/><rect x="468" y="260" width="360" height="138" class="rg" rx="12"/><rect x="844" y="96" width="244" height="302" class="rg" rx="12"/><rect x="40" y="440" width="1048" height="200" class="stratum" rx="12"/><text x="60" y="126" class="rh">탐험</text><text x="108" y="126" class="cnt">부분 5</text><text x="60" y="150" class="rd">안개 낀 갈림길을 등불 하나로 걸어 들어간다</text><g class="lot"><rect x="60" y="172" width="106" height="34" class="lb" rx="7"/><text x="72" y="194.5" class="nm">갈림길 생성</text></g><g class="lot idea"><rect x="226" y="172" width="112" height="34" class="lb" rx="7"/><text x="238" y="194.5" class="nm">숨은 방 찾기</text></g><text x="346" y="194" class="tag">구상</text><g class="lot"><rect x="69" y="256" width="88" height="34" class="lb" rx="7"/><text x="81" y="278.5" class="nm">지형 발견</text></g><g class="lot"><rect x="226" y="256" width="88" height="34" class="lb" rx="7"/><text x="238" y="278.5" class="nm">안개 시야</text></g><path d="M113 206 V252" class="rel" m
