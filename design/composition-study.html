면안 B</a></span></footer><script>const meta=[{"name":"전체 모습","project":"등불길","scope":"구성","caption":"포함은 면으로, 함께 쓰는 관계는 이름 있는 접점으로 읽습니다."},{"name":"한 부분 안","project":"등불길","scope":"진행 저장 / 지도 기록","caption":"안으로 들어가도 발견 보상과 실패 정책은 바깥의 다른 대상으로 남습니다."},{"name":"말과 보고","project":"등불길","scope":"지도 기록 / 관련 기록","caption":"보고가 말한 저장 형식과 사용자가 원한 실패 뒤 동작을 직접 대조합니다."},{"name":"다른 프로젝트","project":"예약 서비스","scope":"경험과 조건","caption":"서비스는 화면의 경험과 그 아래 성립 조건을 대응해 읽습니다. 게임의 배치를 복제하지 않습니다."},{"name":"둘 사이의 연결","project":"등불길 프로젝트","scope":"게임 ↔ 웹","caption":"모양이 다른 두 장면 사이에서 데이터의 약속을 읽습니다. 장르만으로 동일성이나 프로그램 수를 정하지 않습니다."}];function show(i){i=Math.max(0,Math.min(4,i));document.querySelectorAll("section").forEach((s,k)=>s.classList.toggle("on",k===i));document.querySelectorAll("nav button").forEach((s,k)=>s.classList.toggle("on",k===i));project.textContent=meta[i].project;scope.textContent=meta[i].scope;caption.textContent=meta[i].caption;history.replaceState(null,"","#"+(i+1))}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(+b.dataset.i));show((+location.hash.slice(1)||1)-1);</script></html>
