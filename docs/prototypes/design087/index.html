<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network at all: this prototype connects to nothing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>대시보드 시안 비교</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--fg:#1d2330;--muted:#5d6676;--line:#d8dce3;--soft:#eef0f4;
  --accent:#2f5bd3;--accent-fg:#ffffff;--focus:#2f5bd3;
  --warn:#8a4b00;--warn-bg:#fff1dc;--note:#285e3f;--note-bg:#e3f4ea;--info-bg:#e8eefc;
  --a-member:#3d63dd;--a-booking:#0f8571;--a-cancel:#8a3fc2;--a-notify:#b06a00;
  --edge:#9aa3b2;--edge-hi:#2f5bd3;--group:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b;--panel:#1b1f27;--fg:#e6e9ef;--muted:#a3abb9;--line:#343a46;--soft:#232833;
  --accent:#7c9cff;--accent-fg:#0d1220;--focus:#9db4ff;
  --warn:#ffc27a;--warn-bg:#3a2a12;--note:#8fe0b0;--note-bg:#15301f;--info-bg:#1e2740;
  --a-member:#86a0ff;--a-booking:#4fd1b5;--a-cancel:#c99bf0;--a-notify:#f2b45a;
  --edge:#5d6676;--edge-hi:#9db4ff;--group:#191d25;}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1b1f27;--fg:#e6e9ef;--muted:#a3abb9;--line:#343a46;--soft:#232833;
  --accent:#7c9cff;--accent-fg:#0d1220;--focus:#9db4ff;
  --warn:#ffc27a;--warn-bg:#3a2a12;--note:#8fe0b0;--note-bg:#15301f;--info-bg:#1e2740;
  --a-member:#86a0ff;--a-booking:#4fd1b5;--a-cancel:#c99bf0;--a-notify:#f2b45a;
  --edge:#5d6676;--edge-hi:#9db4ff;--group:#191d25;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.demo{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline}
.sub{color:var(--muted);font-size:13px;margin:6px 0 10px}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:14px;color:var(--muted)}
.crumb strong{color:var(--fg)}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--fg);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.note{background:var(--note-bg);color:var(--note)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Detail (shared by all variants) */
.detail{padding:14px 16px}
.detail h2{font-size:18px;margin:0 0 2px}
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 12px}
[role=tab]{border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
[role=tab][aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.item.hi{box-shadow:0 0 0 3px var(--focus)}
.item h4{margin:0 0 4px;font-size:15px}
.item.old h4{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:6px 0 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.sec{font-size:13px;color:var(--muted);text-transform:none;margin:14px 0 4px;font-weight:600}
s{color:var(--muted)}
pre.draft{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.warnbox{background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin:8px 0 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
/* A: spatial map */
.a-grid{display:grid;gap:12px;align-items:start}
@media (min-width:1100px){.a-grid.sel{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.map{position:relative;width:100%}
.map svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .grp{position:absolute;border-radius:16px;background:var(--group);border:1px dashed var(--line)}
.map .grp span{position:absolute;left:12px;top:8px;font-size:13px;color:var(--muted);font-weight:600}
.node{position:absolute;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;cursor:pointer}
.node[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--info-bg)}
.node .nm{font-weight:700;font-size:16px}
.node .sm{font-size:12px;color:var(--muted);margin:2px 0 4px}
.node .fl{display:flex;flex-wrap:wrap;gap:4px}
.node .rl{font-size:11px;color:var(--muted);margin-top:4px}
.edge-label{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--group);stroke-width:5px;stroke-linejoin:round}
/* B: cards + relation */
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{text-align:left;padding:12px;border:2px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--info-bg)}
.card .nm{font-weight:700;font-size:16px}
.rel{position:relative;margin-top:12px;padding:12px}
.rel .cols{display:grid;gap:14px;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;z-index:1}
.rel .col h3{font-size:13px;color:var(--muted);margin:0 0 6px}
.rel svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.rn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;margin:0 0 8px;cursor:pointer;font-size:13px}
.rn.dim{opacity:.35}.rn.hi{border-color:var(--accent);box-shadow:0 0 0 2px var(--info-bg)}
.rn small{display:block;color:var(--muted)}
.rel .conn{display:none;font-size:12px;color:var(--muted)}
@media (max-width:760px){.rel .cols{grid-template-columns:1fr}.rel svg.edges{display:none}.rel .conn{display:block}}
/* C: lanes */
.ov{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px}
.ov .pill{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:14px}
.ov .pill[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--info-bg)}
.ov .arrow{color:var(--muted)}
.ov .gl{font-size:12px;color:var(--muted);margin-left:8px}
.lanes{overflow-x:auto;margin-top:10px}
.lanes table{border-collapse:separate;border-spacing:0;min-width:980px;width:100%}
.lanes th,.lanes td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;font-size:12px}
.lanes thead th{color:var(--muted);font-weight:600;text-align:left}
.lanes tbody th{text-align:left;width:120px;position:sticky;left:0;background:var(--panel);z-index:1}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left-width:5px;background:var(--panel);border-radius:6px;padding:4px 6px;margin:0 0 4px;cursor:pointer;font-size:12px}
.chip.dim{opacity:.3}
.lanes-hint{display:none;font-size:12px;color:var(--muted);margin:8px 0 -4px}
@media (max-width:1040px){.lanes-hint{display:block}}
.swap{display:block;font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 4px;margin:0 0 4px}
/* list alternative */
.list ol{list-style:none;padding:0;margin:0}
.list li{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>예약 서비스 프로젝트 <span class="demo">가상 비교자료 · AI 연결 없음</span></h1>
      <div class="sub" id="who"></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="시안 선택" id="variants"></div>
      <button class="btn" id="list-toggle" aria-pressed="false">목록으로 보기</button>
    </div>
  </header>
  <nav class="crumb" aria-label="위치" id="crumb"></nav>
  <main id="main"></main>
  <p class="sub">이 화면은 합성 자료로 만든 비교용 시안입니다. 어떤 AI에도 접속하거나 무엇을 실행·전송하지 않습니다.</p>
</div>
<script>
'use strict';
/* ---------- Synthetic data (same for all three variants) ---------- */
const ROLES={screen:{name:'화면 담당',tool:'Claude'},api:{name:'API 담당',tool:'Codex'}};
// Sessions are not areas: a role can be handed to a new session; tasks stay recorded separately.
const SESSIONS={
  s1:{role:'screen',label:'Claude 세션 1',span:'10/02 – 10/06',state:'교체됨',why:'대화가 길어져 새 세션으로 옮김'},
  s2:{role:'screen',label:'Claude 세션 2',span:'10/06 –',state:'지금 담당 (기록 기준)'},
  s3:{role:'api',label:'Codex 세션 1',span:'10/03 –',state:'지금 담당 (기록 기준)'}};
const GROUPS={flow:'고객이 거치는 흐름',support:'뒤에서 돕는 기능'};
const AREAS=[
  {id:'member',name:'회원',group:'flow',summary:'가입·로그인 화면',idea:['회원 가입과 로그인','예약 내역은 회원 화면에서 모아 보기']},
  {id:'booking',name:'예약',group:'flow',summary:'날짜·시간을 골라 예약',idea:['날짜·시간 선택 후 예약 확정','회원·비회원 모두 예약 (10/05 결정)']},
  {id:'cancel',name:'취소',group:'flow',summary:'예약 취소 화면',idea:['예약을 찾아 취소','취소 버튼 문구 다듬기']},
  {id:'notify',name:'알림',group:'support',summary:'예약·취소 알림',idea:['예약 확정 알림','취소 알림']}];
const FLOWS=[['member','booking','로그인 (이제 선택)'],['booking','cancel','예약 후 취소'],['booking','notify','예약 알림'],['cancel','notify','취소 알림']];
const DECISIONS={
  d1:{text:'예약은 로그인한 회원만 할 수 있다',date:'10/01',areas:['booking','member'],replacedBy:'d2'},
  d2:{text:'비회원도 이름·연락처로 예약할 수 있다',date:'10/05',areas:['booking','member','notify'],replaces:'d1',
      impact:{booking:'예약 화면과 예약 API 모두 비회원 경로가 필요해요.',member:'예약 전에 로그인을 꼭 하지 않아도 돼요.',notify:'비회원은 입력한 연락처로 알림을 받아요. 수단은 아직 정하지 않았어요.'}}};
const REQUESTS={
  r1:{area:'booking',date:'10/01',text:'예약 화면 만들기 (로그인 필수)',basis:'d1'},
  r2:{area:'booking',date:'10/05',text:'비회원 예약 경로 추가',basis:'d2'},
  r5:{area:'member',date:'10/02',text:'로그인 화면 만들기',basis:null},
  r3:{area:'cancel',date:'10/04',text:'취소 화면 전체 문구와 배치를 정리해 줘',basis:null},
  r4:{area:'cancel',date:'10/08',text:'취소 버튼 문구만 “예약 취소하기”로 바꿔 줘. 다른 건 그대로',basis:null,replaces:'r3'}};
const QUESTIONS=[{area:'notify',date:'10/05',text:'비회원 알림은 문자로 보낼까요, 이메일로 보낼까요?'}];
const TASKS={
  t6:{area:'member',role:'screen',session:'s1',date:'10/02',title:'로그인 화면',request:'r5',basis:null,status:'보고 도착 · 확인 안 함'},
  t1:{area:'booking',role:'screen',session:'s1',date:'10/02',title:'예약 화면 (로그인 필수)',request:'r1',basis:'d1',status:'보고 도착 · 확인 안 함',followedBy:'t2'},
  t3:{area:'booking',role:'api',session:'s3',date:'10/03',title:'예약 생성 API',request:'r1',basis:'d1',status:'지시 보냄 · 실행 상태 알 수 없음',
      sent:'예약 생성 API를 만들어 줘. 로그인 토큰이 없으면 예약을 거절해.'},
  t4:{area:'cancel',role:'screen',session:'s1',date:'10/04',title:'취소 화면 전체 정리',request:'r3',basis:null,status:'보고 도착 · 확인 안 함',followedBy:'t5'},
  t2:{area:'booking',role:'screen',session:'s2',date:'10/06',title:'비회원 예약 경로',request:'r2',basis:'d2',status:'보고 도착 · 확인 안 함'},
  t5:{area:'cancel',role:'screen',session:'s2',date:'10/08',title:'취소 버튼 문구',request:'r4',basis:null,status:'지시 보냄 · 보고 없음'}};
const RESULTS={
  res4:{task:'t6',date:'10/03',text:'로그인 화면 초안을 만들었다는 보고'},
  res1:{task:'t1',date:'10/04',text:'로그인 필수 예약 화면을 만들었다는 보고'},
  res2:{task:'t2',date:'10/07',text:'비회원 이름·연락처 입력 경로를 반영했다는 보고'},
  res3:{task:'t4',date:'10/09',text:'취소 화면 전체 문구와 배치를 고쳤다는 보고',late:true}};
const VARIANTS={A:'A 공간 구조도',B:'B 기능 카드',C:'C 작업 흐름'};
const TABS=[['need','구상·요구'],['work','작업·세션'],['result','결과·검증'],['change','변경']];

/* ---------- Derived facts (shared; every variant shows the same ones) ---------- */
const area=id=>AREAS.find(a=>a.id===id);
const tasksOf=id=>Object.entries(TASKS).filter(([,t])=>t.area===id);
const resultsOf=id=>Object.entries(RESULTS).filter(([,r])=>TASKS[r.task].area===id);
const staleTask=t=>!!(t.basis&&DECISIONS[t.basis].replacedBy&&!t.followedBy);
function flags(id){
  const f=[],stale=tasksOf(id).filter(([,t])=>staleTask(t)).length,res=resultsOf(id);
  const late=res.filter(([,r])=>r.late).length,unchecked=res.filter(([,r])=>!r.late).length,open=QUESTIONS.filter(q=>q.area===id).length;
  if(stale)f.push(['warn',`옛 결정 기준 지시 ${stale}`]);
  if(late)f.push(['warn',`늦게 온 보고 ${late}`]);
  if(unchecked)f.push(['',`확인 안 한 보고 ${unchecked}`]);
  if(open)f.push(['',`미정 ${open}`]);
  if(!tasksOf(id).length)f.push(['note','작업 없음 · 구상만']);
  return f;
}
function rolesOf(id){
  const roles=[...new Set(tasksOf(id).map(([,t])=>t.role))];
  return roles.length?roles.map(r=>`${ROLES[r].name}·${ROLES[r].tool}`).join(' / '):'담당 없음';
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badges=id=>flags(id).map(([k,t])=>`<span class="badge ${k}">${esc(t)}</span>`).join(' ');
const areaColor=id=>`var(--a-${id})`;

/* ---------- State, URL and history ---------- */
const state={v:'A',area:null,tab:'need',list:false,confirmed:false,draft:false,compare:false,focus:null};
let pendingFocus=null;
function hash(){return `#v=${state.v}&a=${state.area??''}&t=${state.tab}&l=${state.list?1:0}`;}
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(VARIANTS[p.get('v')])state.v=p.get('v');
  state.area=area(p.get('a'))?p.get('a'):null;
  state.tab=TABS.some(([id])=>id===p.get('t'))?p.get('t'):'need';
  state.list=p.get('l')==='1';
}
// Area selection, variant and list view are history steps (browser Back works); tab switches replace.
function go(patch,mode='push'){
  Object.assign(state,patch);
  if(mode==='push')history.pushState(null,'',hash());else if(mode==='replace')history.replaceState(null,'',hash());
  render();
}
addEventListener('popstate',()=>{const prev=state.area;readHash();state.focus=null;pendingFocus=state.area?'#detail-title':(prev?`[data-area="${prev}"]`:null);render();});

/* ---------- Shared detail with tabs (WAI-ARIA APG automatic-activation mechanism) ---------- */
function openArea(id,tab,focus){state.focus=focus??null;pendingFocus='#detail-title';go({area:id,tab:tab??state.tab});}
function back(){const prev=state.area;pendingFocus=`[data-area="${prev}"]`;state.focus=null;go({area:null});}
function detail(){
  const a=area(state.area);
  return `<section class="detail" aria-labelledby="detail-title">
    <h2 id="detail-title" tabindex="-1"><span class="dot" style="background:${areaColor(a.id)}"></span>${esc(a.name)}</h2>
    <div class="muted" style="font-size:13px">${esc(a.summary)} · ${badges(a.id)}</div>
    <div role="tablist" aria-label="${esc(a.name)} 상세">${TABS.map(([id,label])=>`<button role="tab" id="tab-${id}" aria-controls="panel" aria-selected="${state.tab===id}" ${state.tab===id?'':'tabindex="-1"'} data-tab="${id}">${label}</button>`).join('')}</div>
    <div role="tabpanel" id="panel" aria-labelledby="tab-${state.tab}" tabindex="0">${panel(a)}</div>
  </section>`;
}
function bindTabs(root){
  const tabs=[...root.querySelectorAll('[role=tab]')];
  tabs.forEach((tab,i)=>{
    tab.addEventListener('click',()=>{pendingFocus=`#tab-${tab.dataset.tab}`;state.focus=null;go({tab:tab.dataset.tab},'replace');});
    tab.addEventListener('keydown',e=>{
      const n={ArrowRight:(i+1)%tabs.length,ArrowLeft:(i-1+tabs.length)%tabs.length,Home:0,End:tabs.length-1}[e.key];
      if(n===undefined)return;e.preventDefault();pendingFocus=`#tab-${tabs[n].dataset.tab}`;state.focus=null;go({tab:tabs[n].dataset.tab},'replace');
    });
  });
}
const hi=key=>state.focus===key?' hi':'';
function panel(a){
  if(state.tab==='need')return needPanel(a);
  if(state.tab==='work')return workPanel(a);
  if(state.tab==='result')return resultPanel(a);
  return changePanel(a);
}
function needPanel(a){
  const decs=Object.entries(DECISIONS).filter(([,d])=>d.areas.includes(a.id));
  const reqs=Object.entries(REQUESTS).filter(([,r])=>r.area===a.id).reverse();
  const qs=QUESTIONS.filter(q=>q.area===a.id);

/* ---------- Edge geometry (mechanism after xyflow getBezierPath: control offset = half the distance) ---------- */
function side(from,to){
  const dx=to.cx-from.cx,dy=to.cy-from.cy;
  return Math.abs(dx)>=Math.abs(dy)?(dx>=0?'R':'L'):(dy>=0?'B':'T');
}
const anchor=(b,s)=>({R:[b.x+b.w,b.cy],L:[b.x,b.cy],B:[b.cx,b.y+b.h],T:[b.cx,b.y]})[s];
const opp={R:'L',L:'R',B:'T',T:'B'};
function curve(a,b){
  const s=side(a,b),[x1,y1]=anchor(a,s),[x2,y2]=anchor(b,opp[s]);
  const h=s==='R'||s==='L',d=h?Math.abs(x2-x1)/2:Math.abs(y2-y1)/2;
  const c1=h?[x1+(s==='R'?d:-d),y1]:[x1,y1+(s==='B'?d:-d)],c2=h?[x2+(s==='R'?-d:d),y2]:[x2,y2+(s==='B'?-d:d)];
  return {d:`M${x1},${y1} C${c1} ${c2} ${x2},${y2}`,mx:(x1+3*c1[0]+3*c2[0]+x2)/8,my:(y1+3*c1[1]+3*c2[1]+y2)/8};
}
const box=(x,y,w,h)=>({x,y,w,h,cx:x+w/2,cy:y+h/2});

/* ---------- Variant B: feature cards + relation diagram of the selected area ---------- */
function relGraph(id){
  const nodes=[],edges=[];const add=(k,col,label,sub)=>nodes.push({k,col,label,sub});
  const reqs=Object.entries(REQUESTS).filter(([,r])=>r.area===id),tasks=tasksOf(id),res=resultsOf(id);
  const decs=Object.entries(DECISIONS).filter(([,d])=>d.areas.includes(id));
  decs.forEach(([k,d])=>add(k,0,d.text,`${d.date} · ${d.replacedBy?'바뀜':'지금 결정'}`));
  decs.forEach(([k,d])=>{if(d.replacedBy&&DECISIONS[d.replacedBy].areas.includes(id))edges.push([k,d.replacedBy]);});
  reqs.forEach(([k,r])=>{add(k,1,r.text,`${r.date}`);if(r.basis)edges.push([r.basis,k]);if(r.replaces)edges.push([r.replaces,k]);});
  QUESTIONS.filter(q=>q.area===id).forEach((q,i)=>add(`q${i}`,1,q.text,`${q.date} · 미정`));
  tasks.forEach(([k,t])=>{add(k,2,t.title,`${t.date} · ${staleTask(t)?'옛 결정 기준':t.status}`);edges.push([t.request,k]);edges.push([k,t.session]);});
  [...new Set(tasks.map(([,t])=>t.session))].forEach(s=>add(s,4,SESSIONS[s].label,`${ROLES[SESSIONS[s].role].name} · ${SESSIONS[s].state}`));
  res.forEach(([k,r])=>{add(k,3,r.text,`${r.date}${r.late?' · 늦게 도착':''} · 확인 안 함`);edges.push([r.task,k]);});
  return {nodes,edges};
}

    if(Math.abs(ra.cx-rb.cx)<4){const x=ra.x+ra.w,d=24;return `<path d="M${x},${ra.cy} C${x+d},${ra.cy} ${x+d},${rb.cy} ${x},${rb.cy}" fill="none" stroke="var(--edge)" stroke-width="1.5" stroke-dasharray="4 3"/>`;}
    const d=(p2[0]-p1[0])/2,toSession=a in SESSIONS||b in SESSIONS;
    return `<path d="M${p1} C${p1[0]+d},${p1[1]} ${p2[0]-d},${p2[1]} ${p2}" fill="none" stroke="${on?'var(--edge-hi)':'var(--edge)'}" stroke-width="${on?2.5:1.5}" ${toSession?'stroke-dasharray="5 4"':''} opacity="${near&&!on?.25:1}"/>`;}).join('');
}

/* ---------- Variant C: work-flow lanes + concept overview ---------- */
const DATES=['10/01','10/02','10/03','10/04','10/05','10/06','10/07','10/08','10/09'];
function events(){
  const ev=[];
  Object.entries(DECISIONS).forEach(([k,d])=>ev.push({k,lane:'user',date:d.date,area:d.areas[0],label:`결정: ${d.text}`,tab:d.replaces?'change':'need'}));
  Object.entries(REQUESTS).forEach(([k,r])=>ev.push({k,lane:'user',date:r.date,area:r.area,label:`요청: ${r.text}`,tab:'need'}));
  QUESTIONS.forEach((q,i)=>ev.push({k:`q${i}`,lane:'user',date:q.date,area:q.area,label:`미정: ${q.text}`,tab:'need'}));
  Object.entries(TASKS).forEach(([k,t])=>ev.push({k,lane:t.role,date:t.date,area:t.area,label:`지시: ${t.title}${staleTask(t)?' · 옛 결정 기준':''}`,tab:'work'}));
  Object.entries(RESULTS).forEach(([k,r])=>ev.push({k,lane:TASKS[r.task].role,date:r.date,area:TASKS[r.task].area,label:`보고: ${r.text}${r.late?' · 늦게 도착':''}`,tab:'result'}));
  return ev;
}
function variantC(){
  const order=['member','booking','cancel'];
  const ov=`<div class="panel ov" role="group" aria-label="구상 개요">${order.map((id,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<button class="pill" data-area="${id}" aria-pressed="${state.area===id}" style="border-left:6px solid ${areaColor(id)}">${esc(area(id).name)} ${badges(id)}</button>`).join('')}
    <span class="gl">${GROUPS.flow}</span><span class="arrow" aria-hidden="true">|</span>
    <button class="pill" data-area="notify" aria-pressed="${state.area==='notify'}" style="border-left:6px solid ${areaColor('notify')}">${esc(area('notify').name)} ${badges('notify')}</button><span class="gl">${GROUPS.support}</span></div>`;
  const ev=events(),lanes=[['user','사용자 결정·요청'],['screen','화면 담당 · Claude'],['api','API 담당 · Codex']];
  const cell=(lane,date)=>{
    const swap=lane==='screen'&&date==='10/06'?'<span class="swap">세션 1 → 세션 2 교체</span>':'';
    return swap+ev.filter(e=>e.lane===lane&&e.date===date).map(e=>`<button class="chip${state.area&&state.area!==e.area?' dim':''}" data-ev="${e.k}" data-area="${e.area}" data-tab="${e.tab}" style="border-left-color:${areaColor(e.area)}">${esc(e.label)}</button>`).join('');
  };
  const table=`<p class="lanes-hint">레인은 좌우로 밀어 날짜를 넘겨 볼 수 있어요.</p><div class="panel lanes" tabindex="0" aria-label="작업 흐름 레인 (좌우로 스크롤)"><table><thead><tr><th scope="col">담당</th>${DATES.map(d=>`<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>
    ${lanes.map(([l,name])=>`<tr><th scope="row">${name}</th>${DATES.map(d=>`<td>${cell(l,d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return ov+table+(state.area?`<div class="panel" style="margin-top:12px">${detail()}</div>`:'<div class="panel detail" style="margin-top:12px"><h2>위 개요에서 영역을 고르거나 레인의 기록을 누르세요</h2></div>');
}

/* ---------- List alternative (same in every variant) ---------- */
function listView(){
  return `<div class="panel list"><ol>${AREAS.map(a=>`<li><div><strong><span class="dot" style="background:${areaColor(a.id)}"></span>${esc(a.name)}</strong> <span class="muted" style="font-size:13px">${GROUPS[a.group]} · ${esc(a.summary)}</span><div>${badges(a.id)}</div><div class="muted" style="font-size:12px">${esc(rolesOf(a.id))}</div></div>
    <button class="btn" data-area="${a.id}" aria-current="${state.area===a.id}">열기</button></li>`).join('')}</ol></div>${state.area?`<div class="panel" style="margin-top:12px">${detail()}</div>`:''}`;
}

/* ---------- Render ---------- */
function render(){
  document.getElementById('who').textContent='담당(기록 기준): 화면 담당 · Claude 세션 2 · API 담당 · Codex 세션 1';
  document.getElementById('variants').innerHTML=Object.entries(VARIANTS).map(([k,l])=>`<button data-v="${k}" aria-pressed="${state.v===k}">${l}</button>`).join('');
  const lt=document.getElementById('list-toggle');lt.setAttribute('aria-pressed',String(state.list));lt.textContent=state.list?'그림으로 보기':'목록으로 보기';
  const a=state.area&&area(state.area),tabLabel=TABS.find(([id])=>id===state.tab)[1];
  document.getElementById('crumb').innerHTML=a?`<button class="link" id="back">← 전체</button><span>전체</span>›<strong>${esc(a.name)}</strong>›<span>${tabLabel}</span>`:'<strong>전체</strong><span>· 회원·예약·취소·알림 4개 영역</span>';
  const main=document.getElementById('main');
  main.innerHTML=state.list?listView():state.v==='A'?variantA():state.v==='B'?variantB():variantC();
  document.getElementById('back')?.addEventListener('click',back);
  document.querySelectorAll('#variants [data-v]').forEach(b=>b.addEventListener('click',()=>{pendingFocus=`#variants [data-v="${b.dataset.v}"]`;go({v:b.dataset.v,list:false});}));
  main.querySelectorAll('.node[data-area],.card[data-area],.pill[data-area],.list [data-area]').forEach(b=>b.addEventListener('click',()=>{
    if(state.area===b.dataset.area){pendingFocus='#detail-title';render();return;}openArea(b.dataset.area);}));
  main.querySelectorAll('.chip[data-ev]').forEach(b=>b.addEventListener('click',()=>openArea(b.dataset.area,b.dataset.tab,b.dataset.ev)));
  main.querySelectorAll('.rn[data-node]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.node,off=state.focus===k;state.focus=off?null:k;pendingFocus=`[data-node="${k}"]`;
    go(off?{}:{tab:TAB_FOR[b.dataset.col]},'replace');}));
  if(main.querySelector('[role=tablist]'))bindDetail(main);
  if(state.v==='B'&&!state.list)requestAnimationFrame(drawRel);
  if(pendingFocus){const el=document.querySelector(pendingFocus);pendingFocus=null;if(el){el.focus({preventScroll:false});if(el.id==='detail-title'||el.id==='draft')el.scrollIntoView({block:'nearest'});}}
}
document.getElementById('list-toggle').addEventListener('click',()=>{pendingFocus='#list-toggle';go({list:!state.list});});
addEventListener('keydown',e=>{if(e.key==='Escape'&&state.area&&!e.target.closest('input,textarea'))back();});
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.v==='A'&&!state.list)render();else if(state.v==='B')drawRel();},120);});
readHash();history.replaceState(null,'',hash());render();
</script>
</body>
