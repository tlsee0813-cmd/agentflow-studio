<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow 시안49 구성·비교·정정</title>
<style>
:root{
  --bg:#f5f5f2; --paper:#fbfbfa; --shell:#fff; --hover:#f1f1ee;
  --line:#e7e6e1; --line2:#d5d4ce;
  --ink:#1b1e27; --ink2:#444a59; --ink3:#646a78;
  --core:#eef0f3; --core-b:#dfe2e9; --core-ic:#596377;
  --hub:#0f7a6c; --hub-ink:#0b5a50; --hub-bg:#e3f1ed; --hub-b:#bfdfd6;
  --ind:#3f51d0; --ind-ink:#2d3bab; --ind-soft:rgba(63,81,208,.15); --ind-bg:#eef0fc;
  --amber:#9a5705; --amber-bg:#fdf3e2;
  --nd-b:rgba(24,30,48,.15); --focus:#1b1e27;
  --f:"Pretendard","Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 · 하단 */
.top,.bot{display:flex;align-items:center;flex-wrap:wrap;background:var(--shell);position:relative;z-index:5}
.top{gap:8px 12px;min-height:52px;padding:7px 16px;border-bottom:1px solid var(--line)}
.bot{gap:8px 14px;min-height:52px;padding:8px 16px;border-top:1px solid var(--line)}
.proj{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 9px;margin-left:-9px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
.proj:hover,.crumb button:hover{background:var(--hover)}
.proj svg.i{width:14px;height:14px;color:var(--ink3)}
.vd{width:1px;height:20px;background:var(--line);flex:none}
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:0 1px;font-size:14px;color:var(--ink2);min-width:0}
.crumb button{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px}
.crumb .sep{color:#b2b5bd;padding:0 2px}
.crumb .here{font-weight:650;color:var(--ink);padding:4px 7px}
.crumb svg.i{width:15px;height:15px;color:var(--ink3)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:13.5px;line-height:1.3;white-space:nowrap}
.b:hover{border-color:#b9b8b1;background:#fafaf8}
.b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.b.pri:hover{background:#2c3142}
.b.pri svg.i{color:#fff}
.b.q{border-color:#c6ccf2;color:var(--ind-ink)}
.b.q:hover{background:var(--ind-bg)}
.b[disabled]{opacity:.45;cursor:default}
.b svg.i{width:15px;height:15px;color:var(--ink3)}
.b.q svg.i{color:var(--ind)}
.b kbd{font:12px var(--f);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.syn{font-size:12px;color:var(--ink3);white-space:nowrap}
.selx{display:flex;align-items:center;gap:10px;min-width:0;max-width:340px;flex:none}
.sic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--core);color:var(--core-ic);flex:none}
.sic.hub{background:var(--hub-bg);color:var(--hub)}
.sic.idea{background:#fff;border:1.5px dashed #c8cad2}
.selt{min-width:0}
.selt b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.selt span{display:block;font-size:12px;color:var(--ink3);line-height:1.3}
.sels{flex:1 1 200px;min-width:0;margin:0;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.zm{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.zm button{min-width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);padding:0 7px;font-size:13px}
.zm button:hover{background:var(--hover)}
.zm button[aria-pressed=true]{background:var(--ind-bg);color:var(--ind-ink)}
.zm span{min-width:44px;text-align:center;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.zm i{width:1px;height:18px;background:var(--line);margin:0 4px}
.hint{font-size:13px;color:var(--ink3);flex:1 1 240px;min-width:0}
.bnote{font-size:13px;color:var(--ink3);flex:1 1 220px;min-width:0}

/* 지도 */
#main{position:relative;min-height:0;overflow:hidden}
.cv{position:absolute;inset:0;overflow:hidden;background:var(--bg);touch-action:none}
.cv.grab{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content}
svg.ln{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
svg.ln.under{z-index:-1}
.ln path{fill:none;stroke-linecap:round}
.ln .faint{stroke:#d2d4db;stroke-width:1.5}
.ln .stubl{stroke:#c9ccd4;stroke-width:1.3;stroke-dasharray:3 4}
.ln .all{stroke:#a9afbe;stroke-width:1.3}
.ln .hi{stroke:var(--ind);stroke-width:1.8}
.ln .mid{stroke:#8e97d6;stroke-width:1.5}
.ln text{font:600 12.5px var(--f);fill:var(--ind-ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.ln text.lt{fill:var(--ink2);font-weight:500}
.rootg{display:grid;gap:34px 32px;align-items:start}
.cell{display:flex;flex-direction:column;gap:24px;align-items:stretch;min-width:0}
.rg{position:relative;background:var(--core);border:1px solid var(--core-b);border-radius:12px;padding:0 12px 12px}
.rg.hub,.frame.hub{background:var(--hub-bg);border-color:var(--hub-b)}
.rg.idea,.frame.idea{background:rgba(255,255,255,.35);border:1.5px dashed #c6c8d0}
.rg.on,.sub.on,.frame.on{border-color:var(--ind);box-shadow:0 0 0 1px var(--ind),0 0 0 5px var(--ind-soft)}
.rg.hot,.sub.hot{border-color:#a2aae6}
.rh,.sh,.fh{position:relative;z-index:3;display:flex;align-items:center;gap:8px}
.rh{min-height:44px;padding:4px 0;cursor:grab}
.rt{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;padding:3px 6px;margin-left:-6px;border-radius:6px;line-height:1.3;color:var(--ink)}
.rt svg.i{width:17px;height:17px;color:var(--core-ic)}
.hub .rt svg.i,.hub .nd svg.i{color:var(--hub)}
.rs{font-size:12.5px;color:var(--hub-ink);line-height:1.35}
.rg>.rs{position:relative;z-index:3;display:table;margin:-8px 0 8px -4px;padding:0 4px;border-radius:4px}
.rg .rt,.rg>.rs,.rg .in,.rg .purpose,.frame .rt,.frame .rs,.frame .ttl,.sub .rt,.sub .in{background:var(--tf,var(--core))}
.rg.hub,.frame.hub{--tf:var(--hub-bg)} .rg.idea,.frame.idea{--tf:#f8f8f6} .sub{--tf:#f9f9fa} .hub .sub{--tf:#f6fbf9}
.rg .purpose{display:table;padding:0 4px;margin-left:-4px;border-radius:4px}
.in{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:2px;font-size:12.5px;color:var(--ink2);padding:3px 4px 3px 8px;border-radius:6px}
.in svg.i{width:13px;height:13px}
.in:hover{background:rgba(255,255,255,.75);color:var(--ink)}
.ns{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.purpose{position:relative;z-index:3;margin:0;font-size:13.5px;color:var(--ink2);max-width:320px}
.nd{position:relative;z-index:3;display:inline-flex;align-items:center;gap:7px;min-height:34px;max-width:236px;padding:6px 11px 6px 9px;background:#fff;border:1px solid var(--nd-b);border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:14px;line-height:1.3;cursor:pointer}
.nd svg.i{width:15px;height:15px;color:var(--core-ic)}
.nd:hover,.stub:hover,.pc:hover{border-color:rgba(24,30,48,.34)}
.nd.inner{box-shadow:3px 3px 0 -1px #fff,3px 3px 0 0 rgba(24,30,48,.18),0 1px 2px rgba(16,24,40,.05)}
.nd .cnt{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nd.on,.pc.on,.stub.on{border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-soft)}
.nd.inner.on{box-shadow:3px 3px 0 -1px #fff,3px 3px 0 0 rgba(63,81,208,.5),0 0 0 3px var(--ind-soft)}
.nd.hot,.pc.hot,.stub.hot{border-color:#929ce4}
.phr{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.phh{position:relative;z-index:3;font-size:12.5px;color:var(--ink3)}
.pc{position:relative;z-index:3;font-size:13.5px;color:var(--ink2);padding:5px 10px;border:1px dashed #c1c3cb;border-radius:8px;background:rgba(255,255,255,.6);max-width:320px;line-height:1.35}
.inw{display:flex;align-items:flex-start;gap:64px}
.frame{position:relative;background:var(--core);border:1px solid var(--core-b);border-radius:16px;padding:0 18px 18px;max-width:860px}
.fh{flex-wrap:wrap;padding:12px 0 14px;gap:4px 12px}
.rt.big{font-size:19px}
.rt.big svg.i{width:20px;height:20px}
.fk{position:relative;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;max-width:820px}
.sub{position:relative;background:rgba(255,255,255,.62);border:1px solid var(--core-b);border-radius:12px;padding:0 10px 10px;min-width:250px;max-width:400px}
.hub .sub{border-color:var(--hub-b)}
.sh{min-height:42px}
.sh .rt{font-size:14.5px}
.loose{position:relative;display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;max-width:400px}
.stubs{display:flex;flex-direction:column;gap:18px;width:268px;padding-top:8px}
.sgh{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.sgh svg.i{width:14px;height:14px}
.stub{position:relative;z-index:3;display:block;width:100%;background:#fff;border:1px solid var(--nd-b);border-radius:8px;padding:6px 10px 7px;margin-bottom:6px}
.stub b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;line-height:1.3}
.stub b svg.i{width:13px;height:13px;color:var(--ink3)}
.stub span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
.ttl{font-size:12.5px;color:var(--ink3)}

/* 장면 */
.scene{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.kick{font-size:12.5px;color:var(--ink3);display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap}
.kick svg.i{width:14px;height:14px}
.scene h1{font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.015em;margin:4px 0 0}
.scene h1:focus{outline:none}
.cw{max-width:1120px;margin:0 auto;padding:22px 32px 56px}
.chead{display:flex;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;margin-bottom:14px}
.chead>div:first-child{flex:1 1 420px;min-width:0}
.cond{margin-top:10px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.cond .cl{font-size:12.5px;color:var(--ink3)}
.cond small{font-size:13px;color:var(--ink3)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;padding:2px;background:#fff}
.seg button{padding:5px 12px;border-radius:7px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.cnote{font-size:13.5px;color:var(--ink2);margin:0 0 14px;max-width:780px}
.cr{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
.chd{position:sticky;top:0;z-index:2;background:var(--paper);border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line2)}
.chd>div{padding:10px 16px 9px}
.chd>div:first-child{padding-left:14px}
.chd b{display:block;font-size:15px;font-weight:700;line-height:1.35}
.chd small{display:block;font-size:12.5px;color:var(--ink3)}
.chd .rhh{font-size:12.5px;color:var(--ink3);padding-top:12px}
.crow{border-bottom:1px solid var(--line);cursor:pointer}
.crow:hover{background:rgba(24,30,48,.022)}
.crow.sel{background:#f2f3fb;box-shadow:inset 3px 0 0 var(--ind)}
.crow>div{padding:12px 16px}
.crow>div:first-child{padding-left:14px}
.rl b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:650;line-height:1.35}
.rl b svg.i{width:13px;height:13px;color:var(--ink3);transition:transform .15s}
.crow.open .rl b svg.i{transform:rotate(90deg)}
.rl small{display:block;font-size:12.5px;color:var(--ink3);margin-left:19px}
.rl em{display:block;font-style:normal;font-size:12px;color:var(--ind-ink);margin-left:19px}
.cv2{font-size:15px;line-height:1.55}
.span2{grid-column:2/4}
.unk{color:var(--ink3)}
.lbl{display:inline-block;font-size:12px;line-height:18px;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.lbl.both{color:var(--ink3);padding-left:0}
.lbl.from{color:var(--ind-ink);border:1px solid #c7ccf1}
.lbl.as{color:var(--ink2);border:1px solid var(--line2)}
.lbl.interp{color:var(--ink3);border:1px solid var(--line2)}
.judge{border-left:2.5px solid var(--amber);padding-left:10px;color:#5f3a07}
.judge .jl{display:block;font-size:12.5px;font-weight:650;color:var(--amber)}
.note{display:block;font-size:13px;color:var(--ink3)}
.fixb{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ind-ink);margin-top:4px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.cx{border-bottom:1px solid var(--line);background:#f4f4f1}
.cx>div{padding:10px 16px 14px}
.cx .cxl{font-size:12.5px;color:var(--ink3);padding-left:33px}
blockquote{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);padding-left:11px;border-left:2px solid #c9c8c1}
.who{font-size:12.5px;color:var(--ink3);margin-top:3px;padding-left:13px}
.nosrc{font-size:13px;color:var(--ink3);margin:0}
.prem{grid-column:2/4;font-size:13.5px;color:var(--ink2);padding-top:0!important}
.prem b{font-weight:650;color:var(--ink)}
.rd{max-width:760px;margin:0 auto;padding:24px 32px 56px}
.rd .lead{font-size:17px;line-height:1.65;margin:12px 0 0}
.rd section{margin-top:26px}
.rd h3{font-size:13px;font-weight:650;color:var(--ink3);margin:0 0 8px}
.rd p{margin:0 0 8px}
.rd .qq{margin-bottom:12px}
.rel{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rel button{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;width:100%;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.rel button:hover{background:var(--hover)}
.rel .v{color:var(--ink3);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:3px 9px;border:1px solid var(--line2);border-radius:7px;background:#fff}
.tag svg.i{width:14px;height:14px;color:var(--core-ic)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.ctx{margin-top:10px;border-left:1px solid var(--line2);padding-left:12px;display:flex;flex-direction:column;gap:5px}
.ctx div{font-size:14px;color:var(--ink2)}
.ctx div b{font-weight:600;color:var(--ink3);font-size:12.5px;margin-right:8px}
.ctx .me{color:var(--ink);font-weight:600}
.cur{font-size:15.5px;margin:0}
.cur mark{background:none;color:inherit;text-decoration:line-through;text-decoration-color:var(--amber);text-decoration-thickness:1.5px}
.cur.done mark{text-decoration:none;background:var(--ind-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:14px;padding:5px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.chip[aria-checked=true]{background:var(--ind-bg);border-color:var(--ind);color:var(--ind-ink);font-weight:600}
textarea{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;line-height:1.6;font-size:14.5px}
textarea:focus,input.ti:focus{outline:2px solid var(--ind);outline-offset:0;border-color:transparent}
.hintl{font-size:13px;color:var(--ink3);margin:6px 0 0}
.imp{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.imp li{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:4px 16px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.imp li b{font-weight:600}
.imp .keep{color:var(--ink3)}
.imp del{color:var(--ink3)}
.imp ins{text-decoration:none;background:var(--ind-bg)}
.lnk{color:var(--ind-ink);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
input.ti{width:100%;font-size:21px;font-weight:700;letter-spacing:-.015em;border:1px solid transparent;border-bottom:1px solid var(--line2);border-radius:6px 6px 0 0;background:transparent;padding:4px 4px}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 16px;margin:18px 0 0;font-size:14.5px}
.dl dt{color:var(--ink3);font-size:13px;padding-top:2px}
.dl dd{margin:0}
.dl ul{margin:0;padding-left:18px}

/* 메뉴 */
.pm{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px -10px rgba(16,24,40,.24),0 2px 6px rgba(16,24,40,.06);padding:6px;width:340px;max-width:calc(100vw - 24px)}
.mi{display:block;width:100%;padding:8px 10px;border-radius:8px}
.mi:hover,.mi.act{background:var(--hover)}
.mi b{display:block;font-size:14px;font-weight:600}
.mi small{display:block;font-size:12.5px;color:var(--ink3)}
.mi[aria-checked=true] b{color:var(--ind-ink)}
.pm input{width:100%;height:36px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;margin-bottom:4px;font-size:14px}
.pm input:focus{outline:2px solid var(--ind);border-color:transparent}
.pm .none{font-size:13px;color:var(--ink3);padding:8px 10px}

@media (max-width:860px){
  .cr{grid-template-columns:minmax(0,1fr)}
  .chd{display:none}
  .crow>div,.cx>div{padding:8px 14px}
  .crow>div:first-child{padding-top:12px}
  .span2,.prem{grid-column:auto}
  .crow .cv2[data-col]::before,.cx [data-col]::before{content:attr(data-col);display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:2px}
  .cx .cxl{padding-left:14px}
  .imp li{grid-template-columns:minmax(0,1fr)}
  .selx{max-width:none}
  .sels{white-space:normal}
}
@media (max-height:560px),(max-width:760px){
  html,body{height:auto}
  body{min-height:100vh;overflow:auto;grid-template-rows:auto auto auto}
  #main{min-height:0;overflow:visible}
  #main.map{height:max(300px,72vh)}
  .scene{position:static;overflow:visible}
  .cw,.rd{padding:16px 16px 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<footer class="bot" id="bot"></footer>
<div id="pop"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={

function fresh(){return{scope:'root',sel:null,fid:null,cams:{},off:{},stack:[],visit:null,all:false,
 cmp:{pair:'ab',row:null,open:null,combo:false,scroll:0},
 corr:{text:null,scope:'all',applied:null,ctx:false,imp:false,dirty:false},

const S={ds:'game',per:{game:fresh(),booking:fresh(),sparse:fresh()},menu:null,q:'',qi:0};
const D=()=>DS[S.ds], ST=()=>S.per[S.ds];
const IT=id=>D().items[id];
const kids=id=>id==='root'?D().order.filter(k=>!IT(k).p&&!IT(k).phrase):D().order.filter(k=>IT(k).p===id);
const chain=id=>{const c=[];for(let x=id;x;x=IT(x).p)c.unshift(x);return c};
const depth=id=>chain(id).length;
const under=(x,y)=>{for(let z=x;z;z=IT(z).p)if(z===y)return true;return false};
const topOf=id=>chain(id)[0];
const sentence=id=>{const it=IT(id);return it.sf?it.sf(ST()):it.s};
const nm=id=>IT(id).n;
function scopeFor(id){const c=chain(id);return c.length<=2?'root':c[c.length-3]}
function visibleIn(id,sc){const it=IT(id);if(sc==='root')return it.phrase||depth(id)<=2;if(id===sc)return true;const p=it.p;return p===sc||(p&&IT(p).p===sc)}
function rep(id,sc){for(let x=id;x;x=IT(x).p)if(visibleIn(x,sc))return x;return null}
const view=()=>{const s=ST().stack;return s.length?s[s.length-1].v:'map'};
const scName=sc=>sc==='root'?D().name:nm(sc);

function renderTop(){const st=ST(),d=D(),v=view();let L='',R='';
 const proj=`<button class="proj" data-act="menu" data-arg="ds" aria-haspopup="true" aria-expanded="${S.menu==='ds'}" id="projBtn">${esc(d.name)}${ic('down')}</button>`;

  L=proj+`<span class="vd"></span><nav class="crumb" aria-label="포함 경로">${crumb.join('<span class="sep">›</span>')}</nav>`;

 }else{

/* --- 지도 --- */
function offKey(id){return ST().scope+':'+id}
function off(id){return ST().off[offKey(id)]||{x:0,y:0}}
function pos(id){const o=off(id);return o.x||o.y?`style="left:${o.x}px;top:${o.y}px"`:''}
function hotSet(){const st=ST(),sel=st.sel,h=new Set();if(!sel)return h;relsTouch(sel).forEach(r=>{const o=under(r.f,sel)?r.t:r.f;h.add(rep(o,st.scope)||o)});return h}
function relsTouch(id){const g=kids(id).length>0||IT(id).p===null;return D().rels.filter(r=>g?under(r.f,id)!==under(r.t,id):(r.f===id||r.t===id))}
function cls(id,H){const st=ST();return (st.sel===id?' on':'')+(H.has(id)?' hot':'')}
function nodeHTML(id,H){const it=IT(id),k=kids(id);
 return `<button class="nd${k.length?' inner':''}${cls(id,H)}" data-id="${id}" data-nav data-nd ${pos(id)} aria-pressed="${ST().sel===id}">${ic(it.ic)}<span>${esc(it.n)}</span>${k.length?`<span class="cnt" aria-label="안에 ${k.length}개">${k.length}</span>`:''}</button>`}
function regionHTML(id,H){const it=IT(id),k=kids(id);
 return `<section class="rg ${it.tone||''}${cls(id,H)}" data-rg="${id}" ${pos(id)}><div class="rh" data-drag="${id}"><button class="rt" data-id="${id}" data-nav aria-pressed="${ST().sel===id}">${ic(it.ic)}<span>${esc(it.n)}</span></button>${k.length?`<button class="in" data-act="enter" data-arg="${id}" tabindex="-1" aria-label="${esc(it.n)} 안으로">안으로${ic('right')}</button>`:''}</div>${it.share?`<span class="rs">${esc(it.share)}</span>`:''}${k.length?`<div class="ns">${k.map(x=>nodeHTML(x,H)).join('')}</div>`:`<p class="purpose">${esc(it.s)}</p>`}</section>`}
function phrHTML(H){const d=D();if(!d.phrases.length)return'';return `<div class="phr" data-rg="@phr"><div class="phh">아직 자리 없는 구절</div>${d.phrases.map(id=>`<button class="pc${cls(id,H)}" data-id="${id}" data-nav data-nd ${pos(id)} aria-pressed="${ST().sel===id}">“${esc(nm(id))}”</button>`).join('')}</div>`}
function rootHTML(H){const R=D().root;
 return `<div class="rootg" style="grid-template-columns:${R.cols.map(c=>c+'px').join(' ')}">${R.cells.map(c=>`<div class="cell" style="grid-column:${c.c};grid-row:${c.r}">${c.ids.map(id=>id==='@phr'?phrHTML(H):regionHTML(id,H)).join('')}</div>`).join('')}</div>`}
function stubsOf(S){return D().rels.filter(r=>under(r.f,S)!==under(r.t,S)).map(r=>{const inb=!under(r.f,S);return{r,o:inb?r.f:r.t,i:inb?r.t:r.f,inb}})}
function innerWorld(S,H){const it=IT(S),k=kids(S),st=ST();
 const conts=k.filter(x=>kids(x).length),leaves=k.filter(x=>!kids(x).length);

 const stubs=stubsOf(S);const groups={};stubs.forEach(s=>{const t=topOf(s.o);(groups[t]=groups[t]||[]).push(s)});
 const stubHTML=Object.keys(groups).map(t=>{const byO={};groups[t].forEach(s=>(byO[s.o]=byO[s.o]||[]).push(s));
  return `<div><div class="sgh">${ic(IT(t).ic)}${esc(nm(t))}</div>${Object.keys(byO).map(o=>`<button class="stub${H.has(o)?' hot':''}" data-stub="${o}" data-nav data-key="stub:${o}" aria-label="${esc(nm(o))}(으)로 이동 — ${esc(byO[o].map(s=>s.r.v).join(', '))}"><b>${ic('out')}${esc(nm(o))}</b>${byO[o].map(s=>`<span>${s.inb?`→ ${esc(nm(s.i))}`:`${esc(nm(s.i))} →`} · ${esc(s.r.v)}</span>`).join('')}</button>`).join('')}</div>`}).join('');
 return `<div class="inw"><section class="frame ${it.tone||''}${st.sel===S?' on':''}" data-rg="${S}"><div class="fh"><button class="rt big" data-id="${S}" data-nav aria-pressed="${st.sel===S}">${ic(it.ic)}<span>${esc(it.n)}</span></button>${it.share?`<span class="rs">${esc(it.share)}</span>`:`<span class="ttl">${esc(sentence(S))}</span>`}</div><div class="fk">${conts.map(sub).join('')}${leaves.length?`<div class="loose">${leaves.map(x=>nodeHTML(x,H)).join('')}</div>`:''}</div></section>${stubs.length?`<aside class="stubs" aria-label="바깥과 이어진 곳">${stubHTML}</aside>`:''}</div>`}

/* 카메라: 선택 때 움직이지 않는다. 처음 들어간 범위만 읽을 크기로 놓고, 이후엔 마지막 시야를 기억한다. */
function cam(){return ST().cams[ST().scope]}
function defCam(){const cv=$('#cv'),w=$('#world');const cw=cv.clientWidth,ch=cv.clientHeight,W=w.offsetWidth,H=w.offsetHeight;
 return{k:1,x:Math.round(W<cw-48?(cw-W)/2:28),y:Math.round(H<ch-40?Math.min((ch-H)/2,140):22)}}
function fitCam(){const cv=$('#cv'),w=$('#world');const cw=cv.clientWidth,ch=cv.clientHeight,W=w.offsetWidth,H=w.offsetHeight;
 const k=Math.max(.8,Math.min(1.15,(cw-48)/W,(ch-40)/H));const c=cam();c.k=k;c.x=Math.round(W*k<cw-24?(cw-W*k)/2:24);c.y=Math.round(H*k<ch-20?(ch-H*k)/2:20);applyCam()}
function applyCam(){const w=$('#world');if(!w)return;const c=cam();w.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.k})`;const z=$('#zl');if(z)z.textContent=Math.round(c.k*100)+'%';schedOff()}
function zoomAt(f,px,py){const c=cam(),cv=$('#cv');if(px==null){px=cv.clientWidth/2;py=cv.clientHeight/2}const k=Math.max(.5,Math.min(2,c.k*f));c.x=px-(px-c.x)*k/c.k;c.y=py-(py-c.y)*k/c.k;c.k=k;applyCam()}
let offRaf=0;function schedOff(){if(offRaf)return;offRaf=requestAnimationFrame(()=>{offRaf=0;const b=$('#revealBtn');if(!b)return;const e=selEl();b.hidden=!e||inCanvas(e)})}
function selEl(){const st=ST();return st.sel&&$('#world')?$('#world').querySelector(`[data-id="${CSS.escape(st.sel)}"]`):null}
function inCanvas(e){const c=$('#cv').getBoundingClientRect(),r=e.getBoundingClientRect();return r.right>c.left+8&&r.left<c.right-8&&r.bottom>c.top+8&&r.top<c.bottom-8}
function reveal(e){const c=$('#cv').getBoundingClientRect(),r=e.getBoundingClientRect(),m=40,cm=cam();let dx=0,dy=0;
 if(r.left<c.left+m)dx=c.left+m-r.left;else if(r.right>c.right-m)dx=c.right-m-r.right;if(r.top<c.top+m)dy=c.top+m-r.top;else if(r.bottom>c.bottom-m)dy=c.bottom-m-r.bottom;
 if(dx||dy){cm.x+=dx;cm.y+=dy;applyCam()}}

function edgeList(){const st=ST(),sc=st.scope,sel=st.sel,d=D(),E=[];
 if(sc==='root'){
  if(st.all){const seen=new Set();d.rels.forEach(r=>{const a=rep(r.f,'root'),b=rep(r.t,'root');if(!a||!b||a===b)return;const k=a+'>'+b;if(seen.has(k))return;seen.add(k);E.push({a,b,cls:'all',label:r.v,lt:1,arrow:1})})}
  else if(!sel){const seen=new Set();d.rels.forEach(r=>{const a=topOf(r.f),b=topOf(r.t);if(a===b)return;const k=[a,b].sort().join('|');if(seen.has(k))return;seen.add(k);E.push({a,b,cls:'faint',rg:1})})}
  if(sel){const big=kids(sel).length>0&&IT(sel).p===null;relsTouch(sel).forEach(r=>{const a=rep(r.f,'root'),b=rep(r.t,'root');if(!a||!b||a===b)return;
   const other=under(r.f,sel)?r.t:r.f;const exact=rep(other,'root')!==other?` · ${nm(other)}`:'';
   E.push({a,b,cls:big?'mid':'hi',label:big?null:r.v+exact,arrow:1})})}
 }else{
  stubsOf(sc).forEach(s=>{const x=rep(s.i,sc);const on=sel&&(sel!==sc&&under(s.i,sel)||sel===s.o);E.push({stub:`stub:${s.o}`,b:x,cls:on?'hi':'stubl',inb:s.inb,arrow:on})});
  if(sel)D().rels.forEach(r=>{if(!under(r.f,sc)||!under(r.t,sc))return;if(!(under(r.f,sel)||under(r.t,sel)))return;const a=rep(r.f,sc),b=rep(r.t,sc);if(!a||!b||a===b)return;E.push({a,b,cls:'hi',label:r.v,arrow:1})});
  if(st.all&&!sel)D().rels.forEach(r=>{if(!under(r.f,sc)||!under(r.t,sc))return;const a=rep(r.f,sc),b=rep(r.t,sc);if(a&&b&&a!==b)E.push({a,b,cls:'all',label:r.v,lt:1,arrow:1})});
 }
 return E}
let lnRaf=0;function schedLines(){if(lnRaf)return;lnRaf=requestAnimationFrame(()=>{lnRaf=0;drawLines()})}
function drawLines(){const svg=$('#ln'),svg0=$('#ln0'),w=$('#world'),cv=$('#cv');if(!svg||!w)return;const c=cam(),C=cv.getBoundingClientRect();const ox=C.left+c.x,oy=C.top+c.y,k=c.k;
 const box=el=>{const r=el.getBoundingClientRect();return{x:(r.left-ox)/k,y:(r.top-oy)/k,w:r.width/k,h:r.height/k}};
 const elId=id=>id==null?null:w.querySelector(`[data-id="${CSS.escape(id)}"]`)?.closest('.rg,.sub,.frame,.nd,.pc')||null;
 const rgEl=id=>w.querySelector(`[data-rg="${CSS.escape(id)}"]`);
 const obst=[...w.querySelectorAll('.nd,.pc,.rt,.stub,.in,.rs,.ttl')].map(box),placed=[];
 const ov=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 const place=(g,txt)=>{const W=[...txt].reduce((n,ch)=>n+(ch===' '?4:/[ -~]/.test(ch)?7.5:12.6),0)+10,Hh=18;let best=null;
  outer:for(const dy of [0,-16,16,-30,30,-46,46,-62,62])for(const t of [.5,.4,.6,.3,.7,.22,.78]){const q=bzp(g,t),p={x:q.x,y:q.y+dy},r={x:p.x-W/2,y:p.y-Hh/2,w:W,h:Hh};if(!obst.some(o=>ov(r,o))&&!placed.some(o=>ov(r,o))){best=p;placed.push(r);break outer}}
  if(!best){best=bzp(g,.5);let r={x:best.x-W/2,y:best.y-Hh/2,w:W,h:Hh};for(let i=0;i<6&&placed.some(o=>ov(r,o));i++){best={x:best.x,y:best.y+Hh};r.y+=Hh}placed.push(r)}return best};
 let P='',P0='',T='';const fr=w.querySelector('.frame'),F=fr?box(fr):null;
 const EL=edgeList();const port=new Map();
 if(F){const ss=EL.filter(e=>e.stub).map(e=>{const t=elId(e.b);return{e,y:t?box(t).y+box(t).h/2:F.y+24}}).sort((a,b)=>a.y-b.y);let last=-1e9;ss.forEach(o=>{let y=Math.max(F.y+24,Math.min(F.y+F.h-18,o.y));y=Math.max(y,last+9);last=y;port.set(o.e,y)})}
 EL.forEach(e=>{let A,B;
  if(e.stub){const s=w.querySelector(`[data-key="${CSS.escape(e.stub)}"]`),t=elId(e.b);if(!s||!t||!F)return;A=box(s);B=box(t);
   const p0={x:A.x,y:A.y+Math.min(A.h/2,16)},p3={x:F.x+F.w,y:port.get(e)};const m=Math.max(18,(p0.x-p3.x)/2);
   const d=e.inb?`M${p0.x},${p0.y} C${p0.x-m},${p0.y} ${p3.x+m},${p3.y} ${p3.x},${p3.y}`:`M${p3.x},${p3.y} C${p3.x+m},${p3.y} ${p0.x-m},${p0.y} ${p0.x},${p0.y}`;
   P+=`<path class="${e.cls}" d="${d}" ${e.arrow?'marker-end="url(#ah)"':''}/>`+(e.arrow?`<circle cx="${p3.x}" cy="${p3.y}" r="3" fill="#3f51d0"/>`:'');return}
  const ea=e.rg?rgEl(e.a):elId(e.a),eb=e.rg?rgEl(e.b):elId(e.b);if(!ea||!eb)return;A=box(ea);B=box(eb);
  const g=bez(A,B);const path=`<path class="${e.cls}" d="${g.d}" ${e.arrow?`marker-end="url(#${e.cls==='hi'?'ah':'am'})"`:''}/>`;
  if(e.cls==='faint')P0+=path;else P+=path;
  if(e.label){const q=place(g,e.label);T+=`<text class="${e.lt?'lt':''}" x="${q.x}" y="${q.y+4}" text-anchor="middle">${esc(e.label)}</text>`}});
 svg.innerHTML=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5z" fill="#3f51d0"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5z" fill="#9aa1b6"/></marker></defs>`+P+T;
 if(svg0)svg0.innerHTML=P0;
}
function bez(A,B){const ac={x:A.x+A.w/2,y:A.y+A.h/2},bc={x:B.x+B.w/2,y:B.y+B.h/2};const dx=bc.x-ac.x,dy=bc.y-ac.y;let p0,p3,c1,c2;
 const gapX=Math.max(B.x-(A.x+A.w),A.x-(B.x+B.w)),gapY=Math.max(B.y-(A.y+A.h),A.y-(B.y+B.h));
 if(gapX>gapY){const s=Math.sign(dx)||1;p0={x:s>0?A.x+A.w:A.x,y:ac.y};p3={x:s>0?B.x:B.x+B.w,y:bc.y};const m=Math.max(28,Math.abs(p3.x-p0.x)/2);c1={x:p0.x+s*m,y:p0.y};c2={x:p3.x-s*m,y:p3.y}}
 else{const s=Math.sign(dy)||1;p0={x:ac.x,y:s>0?A.y+A.h:A.y};p3={x:bc.x,y:s>0?B.y:B.y+B.h};const m=Math.max(24,Math.abs(p3.y-p0.y)/2);c1={x:p0.x,y:p0.y+s*m};c2={x:p3.x,y:p3.y-s*m}}
 return{p0,c1,c2,p3,d:`M${p0.x},${p0.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`}}
function bzp(g,t){const u=1-t,{p0,c1,c2,p3}=g;return{x:u*u*u*p0.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p3.y}}

function renderBot(){const v=view(),st=ST(),d=D();let h='';
 if(v==='map')h=botMap();
 else if(v==='cmp')h=botCmp();
 else if(v==='corr'){const ch=corrChanged();h=`<span class="bnote">원문 발언과 이미 보낸 작업은 바뀌지 않습니다. 닫아도 쓰던 내용은 남습니다.</span><div class="acts"><button class="b" data-act="back">닫기</button><button class="b pri" data-act="applycorr" ${ch?'':'disabled'}>${ic('check')}뜻 정정 반영</button></div>`}
 else if(v==='draft'){h=`<span class="bnote" id="copyNote">${st.draft.copied?'복사함 — 아직 아무에게도 보내지 않았습니다.':'초안은 이 화면을 닫아도 남습니다. 이 시안은 보내거나 실행하지 않습니다.'}</span><div class="acts"><button class="b" data-act="popto" data-arg="0">${ic('map')}지도로 돌아가기</button><button class="b pri" data-act="copy">${ic('copy')}초안 복사</button></div>`}
 else if(v.startsWith('read:')){const id=v.slice(5);const acts=[];
  if(d.corr&&id==='mapRec')acts.push(`<button class="b" data-act="corr">${ic('edit')}뜻 바로잡기</button>`);
  if(IT(id).q&&d.cmp)acts.push(`<button class="b q" data-act="cmp">${ic('cmp')}${esc(d.cmp.title)}</button>`);
  h=`<span class="bnote">${esc(nm(id))} · ${esc(pathText(id))}</span><div class="acts">${acts.join('')}<button class="b" data-act="back">${ic('map')}지도로 돌아가기</button></div>`}
 $('#bot').innerHTML=h;schedOff();
}
function pathText(id){const it=IT(id);if(it.phrase)return '아직 어느 부분에도 붙이지 않은 구절';const c=chain(id).slice(0,-1);return c.length?c.map(nm).join(' › ')+' 안':`${D().name}의 영역`}
function zoomHTML(){const st=ST();return `<div class="zm" role="group" aria-label="보기 조작"><button data-act="all" aria-pressed="${st.all}" title="모든 연결을 함께 보기">${ic('links')}<span style="min-width:0;font-size:12.5px;margin-left:4px">전체 연결</span></button><i></i><button data-act="zout" aria-label="축소">${ic('minus')}</button><span id="zl">${Math.round((cam()||{k:1}).k*100)}%</span><button data-act="zin" aria-label="확대">${ic('plus')}</button><button data-act="fit" title="현재 범위 맞춤 (읽을 수 있는 크기까지만)">${ic('fit')}<span style="min-width:0;font-size:12.5px;margin-left:4px">맞춤</span></button></div>`}
function botMap(){const st=ST(),d=D(),id=st.sel;
 if(!id)return `<span class="hint">부분을 고르면 뜻과 이어갈 일이 여기 나옵니다 · 휠로 확대 · 빈 곳을 끌어 이동 · 부분을 끌어 배치</span>`+zoomHTML();

 let inner='';if(c.from)inner+=`<span class="lbl from">${esc(c.from)}에서</span>`;if(c.k==='as')inner+=`<span class="lbl as">비교용 가정</span>`;

 if(c.k==='interp')return `<div class="cv2" data-col="${esc(colName)}">${inner}${esc(c.t)} <span class="lbl interp">정리된 뜻</span><br><button class="fixb" data-act="corr" data-fid="fix-${colName}">${ic('edit')}뜻 바로잡기</button></div>`;
 if(c.k==='fixed')return `<div class="cv2" data-col="${esc(colName)}">${inner}${esc(c.t)} <span class="lbl interp">선택한 범위</span><span class="note">바로잡은 문장: “${esc(c.quote)}” · 10/25</span><button class="fixb" data-act="corr" data-fid="fix-${colName}">${ic('edit')}다시 바로잡기</button></div>`;
 return `<div class="cv2${c.k==='unk'?' unk':''}" data-col="${esc(colName)}">${inner}${esc(c.t)}</div>`}

function cmpHTML(){const d=D(),C=d.cmp,st=ST(),c=st.cmp;const pair=c.combo?c.pair:'ab';const X=pair==='ab'?'B':'C';
 const colA=pair==='ab'?C.A:{t:'원래 A · 전부 초기화',s:C.A.s},colX=pair==='ab'?C.B:C.C;
 const rows=C.rows.map(r=>{const sel=c.row===r.id,open=c.open===r.id;
  const head=`<div class="rl"><b>${ic('right')}${esc(r.l)}</b>${r.h?`<small>${esc(r.h)}</small>`:''}${r.id===d.corr?.row&&st.corr.applied?'<em>뜻을 바로잡음</em>':''}</div>`;
  const body=r.common?`<div class="cv2 span2"><span class="lbl both">${pair==='ab'?'두 안 모두':'둘 다 같음'}</span>${r.common.k==='as'?'<span class="lbl as">비교용 가정</span>':''}${esc(r.common.t)}</div>`
   :cellHTML(cellOf(r,'A'),colA.t)+cellHTML(cellOf(r,X),colX.t);
  let ex='';if(open){const srcs=r.common?`<div class="span2">${srcHTML(r.sAll,'원문')}</div>`:srcHTML(r.sA||r.sAll,colA.t)+srcHTML(X==='B'?(r.sAll||r.sB):(r.sAll||r.sC),colX.t);
   const prem=r.prem&&(X==='C'||d.key!=='game')?`<div class="prem"><b>함께 바뀌는 전제</b> · ${esc(r.prem)}</div>`:'';

/* ===== 동작 ===== */
function push(v,fid){const st=ST();saveScroll();st.stack.push({v,fid:fid||null});S.menu=null;render();focusScene()}
function popTo(n){const st=ST();saveScroll();let fid=null;while(st.stack.length>n){fid=st.stack.pop().fid||fid}S.menu=null;render();restoreFocus(fid)}
function back(){popTo(ST().stack.length-1)}
function focusScene(){const h=$('#sh');if(h)h.focus({preventScroll:true});if(view()==='draft'){const t=$('#dTitle');t&&t.focus({preventScroll:true})}}
function restoreFocus(fid){requestAnimationFrame(()=>{let e=fid?document.querySelector(`[data-fid="${fid}"]`):null;if(!e&&view()==='map')e=selEl()||$('#world [tabindex="0"]');if(!e&&view()==='cmp'){const r=ST().cmp.row;e=r?document.querySelector(`[data-row="${r}"]`):$('#sh')}if(e)e.focus({preventScroll:true})})}
function select(id){const st=ST();st.sel=id;st.fid=id;renderMap();renderBot();const e=selEl();e&&e.focus({preventScroll:true})}
function setScope(sc,keepVisit){const st=ST();if(!keepVisit)st.visit=null;st.scope=sc;S.menu=null;render();restoreFocus()}
function gotoItem(id){const st=ST();st.stack=[];st.scope=scopeFor(id);st.sel=id;st.fid=id;S.menu=null;S.q='';render();requestAnimationFrame(()=>{const e=selEl();if(e){e.focus({preventScroll:true});schedOff()}})}
function openCmp(fid){const st=ST();const i=st.stack.findIndex(e=>e.v==='cmp');if(i>=0){popTo(i+1);return}push('cmp',fid)}
function act(a,arg,el){const st=ST(),d=D();
 switch(a){
  case 'menu':S.menu=S.menu===arg?null:arg;if(arg==='find'){S.q='';S.qi=0}renderTop();renderPop();return;
  case 'ds':S.ds=arg;S.menu=null;render();restoreFocus();return;
  case 'scope':setScope(arg);return;
  case 'enter':setScope(arg);return;
  case 'visitback':{const v=st.visit;st.visit=null;st.scope=v.scope;st.sel=v.sel;st.fid=v.sel;render();restoreFocus();return}
  case 'goto':gotoItem(arg);return;
  case 'read':push('read:'+st.sel,el&&el.dataset.fid);return;
  case 'cmp':openCmp(el&&el.dataset.fid);return;
  case 'back':back();return;
  case 'popto':popTo(+arg);return;
  case 'zin':zoomAt(1.2);return;
  case 'zout':zoomAt(1/1.2);return;
  case 'fit':fitCam();return;
  case 'all':st.all=!st.all;renderMap();renderBot();return;
  case 'reveal':{const e=selEl();if(e){reveal(e);e.focus({preventScroll:true})}return}
  case 'row':toggleRow(arg);return;
  case 'pair':st.cmp.pair=arg;st.cmp.open=null;renderMain();renderBot();return;
  case 'combine':st.cmp.combo=true;st.cmp.pair='ac';st.cmp.row='map';st.cmp.open='map';renderMain();renderBot();requestAnimationFrame(()=>document.querySelector('[data-row="map"]')?.focus({preventScroll:true}));return;
  case 'corr':push('corr',el&&el.dataset.fid||null);return;
  case 'ctx':st.corr.ctx=!st.corr.ctx;keepFocus(()=>{renderMain()},'[data-act="ctx"]');return;
  case 'imp':st.corr.imp=!st.corr.imp;keepFocus(()=>{renderMain()},'[data-act="imp"]');return;
  case 'cscope':{const s=d.corr.scopes.find(x=>x.k===arg);st.corr.scope=arg;if(!st.corr.dirty)st.corr.text=s.s;keepFocus(()=>{renderMain();renderBot()},`[data-arg="${arg}"]`);return}
  case 'applycorr':{if(!corrChanged())return;st.corr.applied={text:st.corr.text.trim(),scope:st.corr.scope};st.corr.text=st.corr.applied.text;st.corr.dirty=false;st.corr.imp=false;st.cmp.row=d.corr.row;st.cmp.open=null;
   const i=st.stack.findIndex(e=>e.v==='corr');popTo(i>=0?i:st.stack.length-1);return}
  case 'draft':{const i=st.stack.findIndex(e=>e.v==='draft');if(i>=0){popTo(i+1);return}push('draft');return}
  case 'copy':{const t=draftText();const done=()=>{st.draft.copied=true;const n=$('#copyNote');if(n)n.textContent='복사함 — 아직 아무에게도 보내지 않았습니다.'};
   try{navigator.clipboard.writeText(t).then(done,()=>{fallbackCopy(t);done()})}catch(e){fallbackCopy(t);done()}return}
 }}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
function keepFocus(fn,sel){fn();requestAnimationFrame(()=>{const e=document.querySelector(sel);e&&e.focus({preventScroll:true})})}
function toggleRow(id){const c=ST().cmp;if(c.row===id&&c.open===id)c.open=null;else{c.row=id;c.open=id}renderMain();renderBot();requestAnimationFrame(()=>document.querySelector(`[data-row="${id}"]`)?.focus({preventScroll:true}))}

/* 지도 포인터: 빈 곳 끌기=이동, 영역 머리 끌기=영역 배치, 부분 끌기=부분 배치(포함 영역 안). 휠=포인터 기준 배율. */
let drag=null,suppress=false;
document.addEventListener('pointerdown',e=>{const cv=e.target.closest('#cv');if(!cv||e.button!==0)return;const c=cam();
 const nd=e.target.closest('[data-nd]'),rh=e.target.closest('[data-drag]');
 if(nd){const box=nd.closest('.sub,.rg,.frame,.phr');const hd=box.querySelector(':scope>.rh,:scope>.sh,:scope>.fh,:scope>.phh');
  const nr=nd.getBoundingClientRect(),br=box.getBoundingClientRect(),top=hd?hd.getBoundingClientRect().bottom+2:br.top+6;const pad=6*c.k;
  drag={t:'nd',id:nd.dataset.id,el:nd,x0:e.clientX,y0:e.clientY,o0:{...off(nd.dataset.id)},lim:{x0:(br.left+pad-nr.left)/c.k,x1:(br.right-pad-nr.right)/c.k,y0:(top-nr.top)/c.k,y1:(br.bottom-pad-nr.bottom)/c.k}}}
 else if(rh&&ST().scope==='root'&&!e.target.closest('.in')){const el=rh.closest('.rg');drag={t:'rg',id:rh.dataset.drag,el,x0:e.clientX,y0:e.clientY,o0:{...off(rh.dataset.drag)}}}
 else drag={t:'pan',x0:e.clientX,y0:e.clientY,cx:c.x,cy:c.y};
 drag.moved=false});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;const c=cam();
 if(drag.t==='pan'){$('#cv').classList.add('grab');c.x=drag.cx+dx;c.y=drag.cy+dy;applyCam();return}
 let mx=dx/c.k,my=dy/c.k;if(drag.t==='nd'){const L=drag.lim;mx=Math.max(Math.min(L.x0,0),Math.min(Math.max(L.x1,0),mx));my=Math.max(Math.min(L.y0,0),Math.min(Math.max(L.y1,0),my))}
 const o={x:Math.round(drag.o0.x+mx),y:Math.round(drag.o0.y+my)};ST().off[offKey(drag.id)]=o;drag.el.style.left=o.x+'px';drag.el.style.top=o.y+'px';schedLines()});
document.addEventListener('pointerup',()=>{if(drag&&drag.moved){suppress=true;$('#cv')&&$('#cv').classList.remove('grab');schedOff()}drag=null});
document.addEventListener('click',e=>{if(suppress){suppress=false;if(e.target.closest('#cv')){e.stopPropagation();e.preventDefault()}}},true);
document.addEventListener('wheel',e=>{const cv=e.target.closest('#cv');if(!cv)return;e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(Math.exp(-Math.max(-60,Math.min(60,e.deltaY))*.004),e.clientX-r.left,e.clientY-r.top)},{passive:false});

document.addEventListener('click',e=>{
 if(S.menu&&!e.target.closest('.pm')&&!e.target.closest('[data-act="menu"]')){S.menu=null;renderTop();renderPop()}
 const a=e.target.closest('[data-act]');if(a&&!a.disabled){act(a.dataset.act,a.dataset.arg,a);return}
 const row=e.target.closest('[data-row]');if(row){toggleRow(row.dataset.row);return}
 const stub=e.target.closest('[data-stub]');if(stub){const st=ST();st.visit={scope:st.scope,sel:st.sel,label:nm(st.scope)};const o=stub.dataset.stub;st.scope=scopeFor(o);st.sel=o;st.fid=o;render();restoreFocus();return}
 const it=e.target.closest('#world [data-id]');if(it){select(it.dataset.id);return}
 if(e.target.closest('#cv')&&!e.target.closest('[data-rg]')&&ST().sel){ST().sel=null;renderMap();renderBot()}
});
document.addEventListener('dblclick',e=>{const t=e.target.closest('#world [data-id]');if(!t)return;const id=t.dataset.id;if(kids(id).length&&id!==ST().scope)setScope(id)});
document.addEventListener('focusin',e=>{const n=e.target.closest('#world [data-nav]');if(n){ST().fid=navKey(n);[...$('#world').querySelectorAll('[data-nav]')].forEach(x=>x.tabIndex=x===n?0:-1)}
 const cv=$('#cv');if(cv&&(cv.scrollLeft||cv.scrollTop)){cv.scrollLeft=0;cv.scrollTop=0}});
document.addEventListener('input',e=>{const m=e.target.dataset.model,st=ST();
 if(m==='corr'){st.corr.text=e.target.value;st.corr.dirty=true;const b=$('[data-act="applycorr"]');if(b)b.disabled=!corrChanged();const im=$('#impSec');if(im)im.innerHTML=impHTML()}
 if(m==='dtitle')st.draft.title=e.target.value;
 if(m==='dbody')st.draft.body=e.target.value;
 if(e.target.id==='fq'){S.q=e.target.value;S.qi=0;$('#fl').innerHTML=findItems(findList())}});
document.addEventListener('change',e=>{if(e.target.dataset.model==='corr'){renderBot()}});
document.addEventListener('keydown',e=>{
 if(e.isComposing||e.keyCode===229)return;
 const inField=e.target.matches('input,textarea');
 if(S.menu==='find'&&e.target.id==='fq'){const L=findList();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.qi=(S.qi+(e.key==='ArrowDown'?1:-1)+Math.max(1,L.length))%Math.max(1,L.length);$('#fl').innerHTML=findItems(L);return}
  if(e.key==='Enter'){e.preventDefault();if(L[S.qi])gotoItem(L[S.qi]);return}}
 if(e.key==='Escape'){
  if(S.menu){const m=S.menu;S.menu=null;renderTop();renderPop();(m==='ds'?$('#projBtn'):$('#findBtn'))?.focus();e.preventDefault();return}
  const v=view();if(v==='map')return;
  if(v==='cmp'&&ST().cmp.open){const r=ST().cmp.open;ST().cmp.open=null;renderMain();renderBot();document.querySelector(`[data-row="${r}"]`)?.focus({preventScroll:true});e.preventDefault();return}
  if(v==='corr'&&e.target.id==='corrText')renderBot();
  e.preventDefault();back();return}
 if(inField)return;
 if(e.key==='/'&&view()==='map'){e.preventDefault();act('menu','find');return}
 const row=e.target.closest('[data-row]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleRow(row.dataset.row);return}
 if(row&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const rs=[...document.querySelectorAll('[data-row]')];const i=rs.indexOf(row)+(e.key==='ArrowDown'?1:-1);if(rs[i]){e.preventDefault();rs[i].focus()}return}
 const n=e.target.closest('#world [data-nav]');
 if(n&&e.key.startsWith('Arrow')){e.preventDefault();const t=nearest(n,e.key);if(t){t.focus({preventScroll:true});if(!inCanvas(t))reveal(t)}return}
 if(view()==='map'&&!e.ctrlKey&&!e.metaKey&&(e.key==='+'||e.key==='=')){zoomAt(1.2);return}
 if(view()==='map'&&!e.ctrlKey&&!e.metaKey&&e.key==='-'){zoomAt(1/1.2);return}
});
function nearest(from,key){const r=from.getBoundingClientRect(),cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2;let best=null,bs=1e9;
 $('#world').querySelectorAll('[data-nav]').forEach(el=>{if(el===from)return;const q=el.getBoundingClientRect(),x=(q.left+q.right)/2-cx,y=(q.top+q.bottom)/2-cy;
  let p,s;if(key==='ArrowRight'){p=x;s=y}else if(key==='ArrowLeft'){p=-x;s=y}else if(key==='ArrowDown'){p=y;s=x}else{p=-y;s=x}
  if(p<=4)return;const sc=p+Math.abs(s)*2.2;if(sc<bs){bs=sc;best=el}});return best}
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.id==='cv'&&(t.scrollLeft||t.scrollTop)){t.scrollLeft=0;t.scrollTop=0}},true);
window.addEventListener('resize',()=>{if(S.menu){S.menu=null;renderTop();renderPop()}if(view()==='map'){drawLines();schedOff()}});

render();
</script>
</body>
</html>
