<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:">
<title>SPATIAL101 두 안 비교</title>
<style>
:root{--ink:#22223a;--muted:#62627c;--line:#dcdbe8;--paper:#fff;--bg:#f6f6fb;--accent:#5b4bd6;--soft:#efedfc;--warn:#9a520f;--warnbg:#fdf3e7;--ok:#2f6d47;--new:#7a2fe0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #a99cff;outline-offset:2px}
h2{font-size:16px;margin:0 0 6px}h3{font-size:14px;margin:0 0 3px}h4{font-size:13px;margin:12px 0 4px}
.muted{color:var(--muted);font-size:12px}
.tag{font-size:11px;border-radius:5px;padding:0 5px;margin-left:4px;white-space:nowrap;font-weight:400}
.have{background:#e5f2ea;color:var(--ok)}.prop{border:1px dashed var(--new);color:var(--new)}
.top{display:flex;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:15px;margin:0}
.mode button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);font-weight:600}
.bar2{display:flex;align-items:center;gap:8px 12px;padding:6px 14px;background:#fbfbfe;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:underline}
.layer{font-size:12px;background:var(--soft);color:var(--accent);border-radius:99px;padding:1px 8px}
.cur{font-size:12px}.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attn{background:var(--warnbg);color:var(--warn);border-color:#efc58f}
.pop{position:absolute;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;padding:10px;min-width:260px}
.pop button{display:block;width:100%;text-align:left;margin:4px 0}
.app{display:grid;min-height:calc(100vh - 92px)}
.app.A{grid-template-columns:230px minmax(0,1fr) 320px}.app.B,.app.full{grid-template-columns:minmax(0,1fr)}
main{padding:14px;min-width:0}
aside.tree{background:var(--paper);border-right:1px solid var(--line);padding:10px;overflow:auto}
aside.detail{background:var(--paper);border-left:1px solid var(--line);padding:12px;overflow:auto}
.tree ul{list-style:none;margin:0;padding-left:14px}.tree>ul{padding-left:0}
.tree a{display:block;padding:3px 6px;border-radius:6px;cursor:pointer;color:var(--ink);text-decoration:none}
.tree a.here{background:var(--soft);font-weight:600}.tree .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px}
.next{background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0}
.status{font-size:12px;color:var(--muted)}.status.warn{color:var(--warn)}
.canvas{position:relative;background:#fbfbfe;border:1px solid var(--line);border-radius:12px;height:420px;overflow:auto}
.inner{position:relative;width:980px;height:640px}
svg.lines{position:absolute;inset:0;width:980px;height:640px;pointer-events:none}
.card{position:absolute;width:210px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;box-shadow:0 1px 2px #0001;cursor:pointer}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px #d8d2ff}
.card p{margin:2px 0;color:var(--muted);font-size:12px}
.card.blocked{border-left:4px solid var(--warn)}
.card.proposal{border-style:dashed;border-color:var(--new);background:#faf6ff;cursor:default}
.card .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .ttl{all:unset;font-weight:600;cursor:pointer;color:var(--ink)}
.card .ttl:hover{text-decoration:underline}
.under{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:6px}
.mini{position:relative;flex:none;width:140px;height:92px;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden}
svg.lines text{paint-order:stroke;stroke:#fbfbfe;stroke-width:5px}
.mini i{position:absolute;background:#d2cbff;border-radius:2px}
.mini b{position:absolute;border:2px solid var(--accent);border-radius:3px;pointer-events:none}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.listview{display:none}
.lrow{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.lrow.sel{border-color:var(--accent);box-shadow:0 0 0 2px #d8d2ff}.lrow .grow{flex:1;min-width:140px}
.lrow code{font-size:11px;color:var(--muted)}.lrow p{margin:2px 0}
.quick{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.quick input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;flex:1;min-width:180px}
.quick select{border:1px solid var(--line);border-radius:8px;padding:5px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.work{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:900px}
.work section{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:8px;padding:8px}
.box.ext{border-style:dashed}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:22px;max-width:560px}
.empty textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.help{font-size:12px;color:var(--muted);margin-top:8px}
.info{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:10px;margin-top:10px}
.toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.toolbar input{border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#22223a;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:50;max-width:90vw}
.drawer-btn{display:none}
@media (max-width:760px){
  .app.A{grid-template-columns:minmax(0,1fr)}
  aside.tree{display:none}
  aside.tree.open{display:block;position:fixed;top:0;bottom:0;left:0;width:78%;z-index:40;box-shadow:4px 0 16px #0003}
  .drawer-btn{display:inline-block}
  aside.detail{position:fixed;left:0;right:0;bottom:0;max-height:52vh;border-top:1px solid var(--line);box-shadow:0 -6px 16px #0002;z-index:20;display:none}
  aside.detail.open{display:block}
  .canvas,.under{display:none}.listview{display:block}
  .split{grid-template-columns:1fr}.right{margin-left:0}
  .lrow button{min-height:44px;min-width:56px}
}
</style>
</head>
<body>
<div class="top">
  <h1>SPATIAL101 · 화면 구조 두 안 <span class="muted">(검토용 시안 · 가상 데이터 · 저장·네트워크 없음)</span></h1>
  <span class="mode" role="group" aria-label="안 선택">
    <button id="mA" aria-pressed="true">A 선택 우선 · 고정 트리 + 3단</button>
    <button id="mB" aria-pressed="false">B 진입 우선 · 공간 + 작업 전용 화면</button>
  </span>
</div>
<div class="bar2">
  <button class="drawer-btn" id="drawer" aria-label="트리 열기">☰ 트리</button>
  <nav class="crumb" id="crumb" aria-label="경로 (계층 위치)"></nav>
  <span class="right">
    <button class="cur" id="cur" title="이어가는 작업은 ‘이 작업 이어서 하기’로만 바뀝니다. 지도 이동으로 바뀌지 않아요."></button>
    <button class="attn" id="attn" aria-haspopup="true"></button>
  </span>
</div>
<div class="app A" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* Read-only demo state. Everything below is fictional; nothing is saved and there is no network (CSP connect-src 'none').
 * 현재 = exists in the app at 2a40ac3d; 제안 = design proposal, not implemented. */
const H = '<span class="tag have" title="지금 앱(2a40ac3d)에 있는 기능">현재</span>';
const P = '<span class="tag prop" title="설계 제안 · 아직 없음">제안</span>';
const NEEDS = new Set(['question', 'report']); // statuses that need the user's decision or review
const projects = [
  {id: 'P_kiln', name: '도자기 공방 원데이 클래스 예약', brief: '공방 원데이 클래스를 온라인으로 예약받는 사이트', updated: '오늘 10:20',
    recent: '오늘 10:20 · ‘확인 대기 표시’에 구현 보고를 붙여넣음 (앱 미검증)',
    areas: [
      {id: 'A_book', name: '예약', note: '예약받기 · 확정은 공방이 확인한 뒤', x: 40, y: 40, sub: [{id: 'S_wait', name: '대기자 처리', note: '빈자리가 나면 대기자에게 알리기 (구상만)'}],
        tasks: [
          {id: 'T_form', title: '접수 화면 입력 항목 설계', st: 'exported', status: '작업문 내보냄 · 실행 여부 모름',
            next: '개발 도구에서 결과가 돌아오면 ‘결과 붙여넣기’로 가져오세요.', instr: '접수 화면의 입력 항목 설계만 정리해 주세요. 코드 수정과 배포는 하지 마세요.',
            log: ['10:05 작업문 복사함'], ext: null, bases: ['D2 사용자 확정 · 배포는 하지 않는다']},
          {id: 'T_pend', title: '확인 대기 표시', st: 'report', status: '구현 보고 도착 · 앱 미검증',
            next: '보고를 요청과 대조하고, 확인 못 한 동작은 다음 요청으로 남기세요.', instr: '접수 직후 ‘확인 대기’로 보이게 해 주세요.',
            log: ['09:40 작업문 복사함', '10:20 보고 붙여넣음'], ext: '보고문: “확인 대기 문구 추가, 테스트 통과” — 외부 도구의 주장', bases: ['D3 사용자 답변 · 공방 확인 뒤 확정']}]},
      {id: 'A_pay', name: '결제', note: '현장 결제 또는 카드 결제 — 미정', x: 440, y: 40, sub: [],
        tasks: [{id: 'T_paym', title: '결제 방식 정하기', st: 'question', status: '제품 선택 항목 있음',
          next: '카드 결제와 현장 결제 중 하나를 고르세요. 고르기 전까지 결제 화면 요청은 보류돼요.', instr: null, log: ['어제 질문 생김'], ext: null, bases: []}]},
      {id: 'A_sms', name: '알림 문자', note: '예약 확정 후 문자 안내', x: 440, y: 300, sub: [], tasks: []},
      {id: 'A_work', name: '작품 소개', note: '', x: 40, y: 300, sub: [], tasks: []}],
    rel: [['A_book', 'A_sms', '흐름', '확정되면 알림'], ['A_book', 'A_pay', '먼저 필요', '결제는 예약 뒤']]},
  {id: 'P_csv', name: '설문 CSV 정리', brief: '로컬 CSV 설문 응답 확인', updated: '어제', recent: '어제 · 영역 추가',
    areas: [{id: 'A_rows', name: '응답 정리', note: '중복 처리 정책 미정', x: 40, y: 40, sub: [], tasks: []}], rel: []},
  {id: 'P_new', name: '새 프로젝트', brief: null, updated: '방금', recent: '방금 · 만듦', areas: [], rel: []}];

const S = {mode: 'A', view: 'projects', pid: null, aid: null, tid: null, sel: null, info: null, empty: false, q: '',
  current: {pid: 'P_kiln', aid: 'A_book', tid: 'T_pend'}, // the work the user continues: changed only by an explicit button
  targets: {P_kiln: 'A_book'},                            // where a new request goes, per project: changed only by the user's own choice
  drafts: {},                                              // unsent quick-request text, per project (stands in for the existing composer draft)
  vs: {}};                                                 // per-layer view state (selection, scroll), restored on return
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const proj = () => projects.find(p => p.id === S.pid);
const area = () => proj()?.areas.find(a => a.id === S.aid);
const task = () => area()?.tasks.find(t => t.id === S.tid);
const findTask = (pid, tid) => projects.find(p => p.id === pid)?.areas.flatMap(a => a.tasks.map(t => ({a, t}))).find(x => x.t.id === tid);
const attention = p => p ? p.areas.flatMap(a => a.tasks.filter(t => NEEDS.has(t.st)).map(t => ({a, t}))) : [];
const target = () => S.targets[S.pid] ?? '';
const targetName = () => proj().areas.find(a => a.id === target())?.name ?? '영역 없이';
/* Explicit "request in this area": like the app's writeInArea, it sets the exact target, but never moves an unsent draft. */
function requestHere(areaId) {
  const draft = S.drafts[S.pid] ?? '';
  if (draft.trim() && target() !== areaId) { toast(`작성 중인 요청이 ‘${targetName()}’ 대상으로 남아 있어요. 보내거나 비운 뒤 바꿀 수 있어요.`); $('#quick')?.focus(); return; }
  S.targets[S.pid] = areaId; render(); $('#quick')?.focus();
}
const layerKey = () => `${S.mode}|${S.pid}|${S.view === 'area' ? S.aid : ''}`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200); }

/* Navigation. Moving changes only what is shown: never the continued work, the request target or any permission. */
function saveLayer() { if (S.view === 'space' || S.view === 'area') { const c = $('.canvas'); S.vs[layerKey()] = {sel: S.sel, x: c?.scrollLeft || 0, y: c?.scrollTop || 0}; } }
function go(view, ids = {}) {
  saveLayer(); closePop();
  Object.assign(S, ids, {view, info: null});
  const v = S.vs[layerKey()]; S.sel = (view === 'space' || view === 'area') && v ? v.sel : null;
  render();
  if (v) { const c = $('.canvas'); if (c) { c.scrollLeft = v.x; c.scrollTop = v.y; drawViewport(); } }
  focusMain();
}
function up() {
  if (S.view === 'task') go('area', {tid: null}); else if (S.view === 'area') go('space', {aid: null}); else if (S.view === 'space') go('projects', {pid: null});
}
function focusMain() {
  setTimeout(() => {
    const now = document.activeElement; if (now && now !== document.body && document.contains(now)) return; // the user already moved focus
    const t = S.sel && (document.querySelector(`.card[data-id="${S.sel}"]`) || document.querySelector(`.lrow[data-id="${S.sel}"] button`)); (t && t.offsetParent ? t : document.querySelector('main h2'))?.focus?.(); }, 0);
}
const LAYER = {projects: '모든 프로젝트', space: '1층 · 프로젝트 전체 (영역들)', area: '2층 · 영역 안 (요청·작업)', task: '작업'};

function renderBar() {
  const c = $('#crumb'); c.innerHTML = '';
  const add = (label, fn) => {
    if (c.children.length) c.append(el('span', '', '›'));
    const a = el(fn ? 'a' : 'strong', '', label);
    if (fn) { a.tabIndex = 0; a.onclick = fn; a.onkeydown = e => { if (e.key === 'Enter') fn(); }; } else a.setAttribute('aria-current', 'location');
    c.append(a);
  };
  add('모든 프로젝트', S.view === 'projects' ? null : () => go('projects', {pid: null, aid: null, tid: null}));
  if (S.pid) add(proj().name, S.view === 'space' ? null : () => go('space', {aid: null, tid: null}));
  if (S.aid) add(area().name, S.view === 'area' ? null : () => go('area', {tid: null}));
  if (S.tid) add(task().title, null);
  c.append(el('span', 'layer', LAYER[S.view]));
  const cur = findTask(S.current.pid, S.current.tid), cb = $('#cur');
  cb.innerHTML = `이어가는 작업: <b>${cur.t.title}</b> ${H}`;
  cb.onclick = () => go('task', {pid: S.current.pid, aid: cur.a.id, tid: cur.t.id});
  const n = attention(proj()).length, b = $('#attn');
  b.style.display = S.pid ? '' : 'none'; b.innerHTML = `판단 필요 <b>${n}</b> <span class="muted">(앱 기록 기준)</span>`;
  b.onclick = e => { e.stopPropagation(); togglePop(b); };
  $('#drawer').style.display = S.mode === 'A' && S.view !== 'projects' ? '' : 'none';
}
/* Attention list: every area of the open project, so a blockage elsewhere is not missed. Opening one is an explicit choice. */
function togglePop(anchor) {
  if ($('.pop')) return closePop();
  const p = el('div', 'pop'); p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', '판단 필요 목록');
  p.append(el('div', 'muted', `모든 영역의 질문과 미검증 보고 ${P}`));
  for (const {a, t} of attention(proj())) { const b = el('button', '', `<b>${a.name}</b> · ${t.title}<br><span class="status warn">${t.status}</span>`); b.onclick = () => go('task', {aid: a.id, tid: t.id}); p.append(b); }
  const r = anchor.getBoundingClientRect(); p.style.top = (r.bottom + scrollY + 4) + 'px'; p.style.left = Math.max(8, Math.min(r.left, innerWidth - 290)) + 'px';
  document.body.append(p); p.querySelector('button')?.focus();
}
function closePop() { $('.pop')?.remove(); }

function render() {
  renderBar();
  const app = $('#app'); app.innerHTML = '';
  if (S.view === 'projects') { app.className = 'app full'; app.append(projectsView()); return; }
  if (S.mode === 'A') {
    app.className = 'app A';
    const m = el('main'), d = el('aside', 'detail'); d.setAttribute('aria-label', '상세');
    app.append(treeView(), m, d);
    if (S.view === 'task') { m.append(workView()); d.append(taskSide()); }
    else { m.append(layerView()); d.append(detailView()); if (S.sel) d.classList.add('open'); }
  } else {
    app.className = 'app B';
    const m = el('main'); app.append(m);
    m.append(S.view === 'task' ? workView() : layerView());
  }
  drawViewport();
}

function projectsView() {
  const m = el('main');
  m.append(el('h2', '', `프로젝트 ${H}`)); m.querySelector('h2').tabIndex = -1;
  const tb = el('div', 'toolbar'), s = el('input');
  s.placeholder = '프로젝트 검색'; s.value = S.q; s.setAttribute('aria-label', '프로젝트 검색');
  s.oninput = () => { S.q = s.value; render(); const i = $('.toolbar input'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  const e = el('button', '', S.empty ? '예시 프로젝트 보기' : '빈 첫 화면 보기'); e.id = 'toggle-empty';
  e.onclick = () => { S.empty = !S.empty; render(); };
  tb.append(s, el('span', 'muted', '최근 수정순'), e); m.append(tb);
  const list = S.empty ? [] : projects.filter(p => p.name.includes(S.q));
  if (!list.length) {
    m.append(el('div', 'empty', S.empty ? `<h3>무엇을 만들고 싶나요?</h3>
      <p class="muted">목적을 한두 문장으로 적으면 시작돼요. 영역은 나중에 필요할 때 나누면 돼요. ${H}</p>
      <textarea rows="2" aria-label="프로젝트 목적" placeholder="예: 공방 원데이 클래스를 온라인으로 예약받고 싶어요"></textarea>

  const cb = el('button', isCur ? '' : 'primary', isCur ? '이어가는 작업이에요' : '이 작업 이어서 하기'); cb.disabled = isCur; cb.id = 'continue';
  cb.onclick = () => { S.current = {pid: S.pid, aid: a.id, tid: t.id}; toast('이어가는 작업을 바꿨어요 (명시 행동 · 시연).'); render(); };
  w.append(cb, el('span', 'muted', isCur ? '' : ' 이 화면을 연 것만으로는 이어가는 작업이 바뀌지 않아요'));
  w.append(el('div', 'next', `<b>지금 할 일</b> · ${t.next}`));
  if (t.st === 'question') {
    const s = el('section', '', `<h4>제품 선택 질문 ${H}</h4><p>카드 결제와 현장 결제 중 무엇으로 할까요?</p>`);
    for (const l of ['카드 결제', '현장 결제', '모름', '보류']) { const b = el('button', '', l); b.onclick = () => toast(`‘${l}’ 답을 기록하는 자리예요 (시연 · 저장 안 함)`); s.append(b, ' '); }
    w.append(s);
  }
  w.append(el('section', '', `<h4>이번 요청 원문 ${H}</h4><p>${t.instr || '<span class="muted">(아직 요청 없음 · 질문 답을 기다림)</span>'}</p>`));
  const st = el('section', '', '<h4>상태 근거</h4>'), sp = el('div', 'split');
  sp.append(el('div', 'box', `<b>앱 기록</b> ${H}<br>${t.log.join('<br>')}`),
    el('div', 'box ext', `<b>외부 도구(Codex·Claude 등)</b><br>${t.ext ? t.ext + '<br><span class="status warn">앱이 확인한 것 아님</span>' : '실행 중인지·끝났는지 <b>알 수 없음</b>. 앱에 근거가 없어요.'}<br><span class="muted">실행 상태는 붙여넣은 결과 같은 근거가 있을 때만 표시 ${P}</span>`));
  st.append(sp); w.append(st);
  w.append(el('section', '', `<h4>작업문 전달 ${H}</h4><button disabled>작업문 복사</button> <button disabled>Markdown 저장</button> <span class="muted">복사해도 개발 도구가 실행되지는 않아요</span>`));
  w.append(el('section', '', `<h4>결과 회수 ${H}</h4><button disabled>결과 붙여넣기</button> <button disabled>결과 파일 가져오기</button>${t.st === 'report' ? '<p class="status warn">보고 1건 · 앱 미검증. 요청과 대조 필요</p>' : ''}`));
  const ai = el('section', '', '<h4>AI 도움</h4>');
  const g1 = el('button', '', `다음 작업 구체화 ${H}`); g1.onclick = () => toast('지금 앱의 영역 안내(한 줄 구상 → 질문 최대 1개 → 검토할 초안)를 여는 자리예요.');
  const g2 = el('button', '', `변경 영향 보기 ${P}`); g2.disabled = true; g2.title = '아직 없음';
  const g3 = el('button', '', `인계 작업문 ${H}`); g3.onclick = () => toast('지금 앱의 작업문 만들기와 같아요.');
  ai.append(g1, ' ', g2, ' ', g3, el('p', 'muted', '변경 영향(제안): 이 작업에 걸린 기준·관계를 공유하는 다른 영역 요청을 보여 주기만 함. 자동 수정 없음.'));
  w.append(ai);
  if (S.mode === 'B') { const bs = el('details'); bs.id = 'task-bases'; bs.append(el('summary', '', `기준 · 출처와 보류 ${H}`), taskSide(true)); w.append(bs); }
  w.append(el('details', '', `<summary>지난 기록 펼치기 ${H}</summary><p class="muted">기본은 접혀 있어요. 전체 이력을 늘 펼치지 않아요.</p><p>${t.log.join('<br>')}</p>`));
  return w;
}
function taskSide(folded = false) {
  const t = task(), d = el('div');
  if (!folded) d.append(el('h2', '', '기준 · 출처'));
  d.append(el('p', 'muted', `이 작업에 걸린 사용자 결정과 원문 ${H}`));
  for (const b of t.bases) d.append(el('p', '', b));
  if (!t.bases.length) d.append(el('p', 'muted', '걸린 기준 없음'));
  d.append(el('h4', '', `보류 · 다음 행동 ${H}`), el('p', '', t.next));
  return d;
}
function drawViewport() {
  const c = $('.canvas'), b = $('.mini b'); if (!c || !b) return;
  const W = 980, Hh = 640, vw = Math.min(c.clientWidth, W), vh = Math.min(c.clientHeight, Hh); // the frame never exceeds the layer
  Object.assign(b.style, {left: c.scrollLeft / 7 + 'px', top: c.scrollTop / 7 + 'px', width: vw / 7 + 'px', height: vh / 7 + 'px'});
}
addEventListener('resize', drawViewport);
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('#attn')) closePop(); });
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if (e.key === 'Escape') { if ($('.pop')) return closePop(); $('aside.tree')?.classList.remove('open'); if (S.info || S.sel) { S.info = null; S.sel = null; render(); } return; }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === '/') { e.preventDefault(); $('#quick')?.focus(); }
  else if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowUp')) { e.preventDefault(); up(); }
  else if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key) && (S.view === 'space' || S.view === 'area') && !e.altKey) {
    const its = items(), on = document.activeElement?.dataset?.id; let i = its.findIndex(x => x.id === (on || S.sel));
    i = (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length; e.preventDefault();
    if (S.mode === 'A') { S.sel = its[i].id; render(); }
    document.querySelector(`.card[data-id="${its[i].id}"]`)?.focus();
  }
});
function setMode(m) { saveLayer(); S.mode = m; S.sel = null; S.info = null; $('#mA').setAttribute('aria-pressed', String(m === 'A')); $('#mB').setAttribute('aria-pressed', String(m === 'B')); render(); }
$('#mA').onclick = () => setMode('A'); $('#mB').onclick = () => setMode('B');
render();
</script>
