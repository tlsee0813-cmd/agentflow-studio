<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentFlow Studio</title>
  <meta name="description" content="Codex·Claude에서 온 개발 기록을 프로젝트의 부분별 지도로 정리해 보여 줍니다.">
  <link rel="stylesheet" href="./styles.css"><script type="module" src="./client/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="#/" aria-label="AgentFlow Studio 프로젝트 목록"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="7" height="5" rx="1.6"/><rect x="14.5" y="4" width="7" height="5" rx="1.6"/><rect x="8.5" y="15" width="7" height="5" rx="1.6"/><path d="M6 9v2.5h12V9M12 11.5V15"/></svg><span>AgentFlow Studio</span></a>
      <nav class="crumbs" aria-label="위치"><a id="crumb-home" href="#/">프로젝트</a><span id="crumb-sep" class="sep" aria-hidden="true" hidden>/</span><strong id="crumb-project" hidden></strong><span id="crumb-tag" class="tag" hidden></span></nav>
      <span class="grow"></span>
      <span id="ai-pill" class="ai-pill" data-state="checking"><i aria-hidden="true"></i><span id="ai-text">AI 확인 중</span></span>
    </header>
    <main id="home" class="home" hidden>
      <div class="home-inner">
        <h1 class="home-title">프로젝트</h1>
        <p class="home-lede">Codex·Claude에서 개발한 기록을 프로젝트의 부분에 연결해, 구조와 최근 변화를 한눈에 봅니다.</p>
        <form id="new-form" class="new-form"><label for="new-name" class="sr-only">새 프로젝트 이름</label><input id="new-name" maxlength="120" placeholder="새 프로젝트 이름" autocomplete="off"><button type="submit" class="primary">내 프로젝트 시작</button></form>
        <div id="home-message" class="message" role="status" hidden></div>
        <ul id="project-list" class="project-list"></ul>
        <h2 id="saved-title" class="home-sub" hidden>이 브라우저에 저장된 프로젝트</h2>
        <ul id="saved-list" class="project-list"></ul>
        <div class="home-foot">
          <p>예제는 Codex·Claude에서 전달받았다고 가정하고 쓴 기록이에요. 실제 기록 연결기는 아직 설치되어 있지 않아요.</p>
          <button type="button" id="import" class="link-button">백업 파일 가져오기</button><input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </main>
    <main id="space" class="space" hidden>
      <div id="viewport" class="viewport" tabindex="-1" aria-label="프로젝트 지도"><div id="world" class="world"></div></div>
      <section id="recent" class="recent" aria-labelledby="recent-title">
        <button type="button" id="recent-toggle" class="recent-head" aria-expanded="true"><span id="recent-title">최근 변화</span><span id="recent-count" class="count"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
        <ol id="recent-list" class="recent-list"></ol>
      </section>
      <div class="controls" role="toolbar" aria-label="지도 보기">
        <button type="button" id="zoom-out" aria-label="축소" title="축소">−</button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button type="button" id="zoom-in" aria-label="확대" title="확대">+</button>
        <button type="button" id="zoom-fit" aria-label="전체 보기" title="전체 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
        <button type="button" id="add-part" class="add-part" hidden>+ 부분</button>
        <span class="legend" aria-label="상태"><i class="s-reported"></i>보고 받음<i class="s-active"></i>진행 중<i class="s-plan"></i>구상</span>
      </div>
      <p id="space-empty" class="space-empty" hidden></p>
      <div id="part-form" class="part-form" hidden></div>
      <aside id="panel" class="panel" aria-labelledby="panel-title" hidden></aside>
    </main>
  </div>
</body>
</html>
