<script>

const $ = s => document.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function icon(name){return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${['clock','info'].includes(name)?'<circle cx="12" cy="12" r="9"/>':''}<path d="${glyphs[name]||glyphs.info}"/></svg>`;}
function button(label,action,value='',style='',disabled=false){return `<button type="button" class="btn ${style}" data-action="${action}" data-value="${esc(value)}" ${disabled?'disabled':''}>${label}</button>`;}
function tag(text,kind=''){return `<span class="tag ${kind}">${text}</span>`;}
const stepNames=['바꾸고 싶은 것','두 결과 체험','개발에 전할 기준','결과와 맞춰보기','다음 변경에 쓰기'];
const initialRequest='수업에 빈자리가 생기면 대기자를 자동으로 넣어줘.';
const copyRequest="예약 버튼의 ‘신청’을 ‘참여 신청’으로 바꿔줘. 예약 방식과 대기 순서는 그대로.";
const fresh=()=>({step:0,maxStep:0,route:'waitlist',input:initialRequest,inputSnapshot:null,notes:'',draftCustom:'',choice:null,revision:0,history:[],scene:{A:'ready',B:'ready'},review:null,next:null,detail:null,notice:'',skipped:false});
let state=fresh(); let toastTimer; let modalAction=null;
const modeTitle=mode=>mode==='A'?'차례가 오면 바로 예약':mode==='B'?'참여를 확인한 뒤 예약':'아직 정하지 않음';
const modeRule=(mode,priority='fifo')=>priority==='fast'?'빈자리를 모든 대기자에게 안내하고, 먼저 수락한 사람을 예약한다.':mode==='A'?'빈자리가 생기면, 대기 1번을 별도 수락 없이 예약한다.':mode==='B'?'빈자리가 생기면, 대기 1번에게 먼저 묻고 수락해야 예약한다.':'예약 확정 방식은 아직 정하지 않았다.';
const priorityRule=priority=>priority==='fast'?'대기자 모두에게 안내하고 먼저 수락한 사람에게 배정한다.':'먼저 대기한 사람에게 먼저 기회를 준다. 거절하면 다음 차례로 넘긴다.';
const isKnown=()=>!!state.choice&&['A','B'].includes(state.choice.kind);
function choiceSummary(c=state.choice){if(!c)return '아직 정한 기준이 없어요';if(c.kind==='custom')return c.text;if(c.kind==='defer')return '예약 확정 방식 · 보류';return `${modeTitle(c.kind)}${c.priority==='fast'?' · 먼저 응답한 사람 우선':''}`;}
function originLabel(c=state.choice){return c?.origin==='provided'?'제공된 기존 기준 · 예시':c?.kind==='defer'?'보류':c?.kind==='custom'?'직접 입력 · 자동 비교 안 함':'이 체험에서 선택';}
function currentActual(review=state.review){if(!review)return null;return review.corrected?{kind:state.choice.kind,priority:state.choice.priority||'fifo'}:review.actual;}
function reviewStale(){const r=state.review;return !!r&&(r.acceptedRevision??r.baseRevision)!==state.revision;}
function addHistory(label,detail){state.history.push({revision:state.revision,label,detail});}
function applyChoice(kind,{text='',priority='fifo',origin='user',source='두 결과 중 선택',navigate=true}={}){
 const prev=state.choice;
 const same=prev&&prev.kind===kind&&prev.text===text&&prev.priority===priority;
 if(!same){state.revision++;state.choice={id:'D-01',kind,text,priority,origin};addHistory(source,choiceSummary());if(prev){state.notice='기준을 바꿨어요. 기존 모의 비교는 이전 기록으로 남기고 다시 비교합니다. 입력과 직접 메모는 유지됩니다.';state.next=null;}}
 if(navigate)go(2);else render();
}
function go(step){if(step>0&&state.choice&&state.inputSnapshot!==null&&state.inputSnapshot!==state.input){state.revision++;state.inputSnapshot=state.input;addHistory('요청 원문 수정 · 자동 분석 없음',state.input);state.notice='요청 원문이 바뀌어 기존 모의 비교를 다시 확인하도록 표시합니다. 문장을 AI로 재해석하지는 않았어요.';state.next=null;}state.step=step;state.maxStep=Math.max(state.maxStep,step);state.detail=null;render(true);}
function announce(text){$('#announcer').textContent=text;}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3600);announce(text);}
function heading(kicker,title,description){return `<header class="page-heading"><p class="eyebrow">${kicker}</p><h1>${title}</h1><p>${description}</p></header>`;}
function backFooter(previous,forwardLabel,forwardAction,forwardValue='',disabled=false){return `<div class="end-actions">${button(icon('back')+' 이전으로','nav',previous,'quiet')}<div class="actions">${forwardLabel?button(forwardLabel+' '+icon('arrow'),forwardAction,forwardValue,'primary',disabled):''}</div></div>`;}
function sceneStrip(){return `<div class="scenario-strip"><div><strong>목요일 저녁 요가에 1자리가 났어요</strong><p>같은 상황 · 두 안 모두 대기 순서를 지켜요</p></div><div class="people"><span class="pill-person"><span class="avatar">지</span>지수 · 1번</span><span class="muted small">→</span><span class="pill-person"><span class="avatar second">민</span>민호 · 2번</span></div></div>`;}
function render(focus=false){
 $('#steps').innerHTML=stepNames.map((name,i)=>`<button type="button" class="step-button ${state.step===i?'active':''}" data-action="nav" data-value="${i}" ${i>state.maxStep?'disabled':''} ${state.step===i?'aria-current="step"':''}><span class="step-number">${i<state.step?'✓':String(i+1).padStart(2,'0')}</span><span><span class="step-name">${name}</span><span class="step-state">${state.skipped&&i===1?'새 결정 없이 통과':state.step===i?'지금 이 장면':i<state.step?'다시 볼 수 있어요':'이어지는 장면'}</span></span></button>`).join('');
 $('#context-step').textContent=stepNames[state.step];
 const pages=[inputPage,experiencePage,handoffPage,reviewPage,nextPage];
 $('#main').innerHTML=`<div class="fade">${state.notice?`<div class="notice blue">${esc(state.notice)} ${button('닫기','dismiss','','quiet compact')}</div>`:''}${pages[state.step]()}</div>`;
 renderDetail();
 if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});announce(stepNames[state.step]);}
}
function inputPage(){return heading('01 / START WITH A MOMENT','“자동으로”라는 말 뒤에,<br>같은 결과를 생각하고 있나요?','수업 예약 앱을 만드는 1인 제작자의 입장에서 시작해 보세요.<br>설명을 더 쓰기 전에, 고객에게 일어날 한 순간을 먼저 겪어봅니다.')+`
 <section class="panel"><div class="panel-head"><div><h3>이번에 바꾸고 싶은 것</h3><p>프로젝트 전체가 아니라, 작은 요청 하나면 돼요.</p></div>${tag('예약 앱 예시')}</div>
 <div class="request-tabs"><button type="button" class="chip ${state.route==='waitlist'?'selected':''}" data-action="route" data-value="waitlist">대기예약 만들기</button><button type="button" class="chip ${state.route==='copy'?'selected':''}" data-action="route" data-value="copy">문구만 바꾸기 · 바로 통과</button></div>
 <label class="field-label" for="request">개발 도구에 말하려던 요청</label><textarea id="request" maxlength="1000" data-field="input">${esc(state.input)}</textarea><p class="field-hint">이 시제품은 정해진 예약 예시로 진행해요. 직접 쓴 문장은 이 탭에 기록되지만 AI로 분석하지 않습니다.</p>
 ${state.route==='copy'?`<div class="notice green spaced"><strong>제공된 기존 기준(예시)</strong><br>대기 순서대로 안내하고, 참여를 확인한 뒤 예약합니다. 문구 변경만으로 이 기준을 다시 승인하지 않아요.</div>`:`<div class="intro-row"><div class="intro-copy"><h3>빈자리가 생긴 다음,<br>고객은 무엇을 보게 될까요?</h3><p>바로 예약해 주는 편의와, 참석 의사를 다시 확인하는 편의.<br>두 방식 모두 자연스럽지만, 결과는 다릅니다.</p></div><div class="scene-preview"><div class="ticket"><div class="ticket-top"><strong>MONO / 요가 클래스</strong>${tag('1자리 비었어요','green')}</div><h3>목요일 저녁 요가</h3><p class="muted small">19:00 – 20:00 · 차분하게 하루 마무리</p><div class="ticket-bottom"><span class="pill-person"><span class="avatar">지</span>지수 · 대기 1번</span><span class="muted small">이 다음은?</span></div></div></div></div>`}
 <div class="end-actions"><span class="muted small">${icon('lock')} 외부로 보내지 않아요</span>${button(state.route==='copy'?'바로 기준으로 가기 '+icon('arrow'):'두 결과 체험하기 '+icon('arrow'),'start','','primary')}</div></section>
 <div class="quiet-note">${icon('info')}<span>체험에서 고른 것은 이 예시의 기준일 뿐입니다. 실제 예약, 알림 발송, 코드 실행 권한은 생기지 않습니다.</span></div>`;}
function phone(mode){
 const s=state.scene[mode];let title='아직 빈자리가 없어요',help='지수는 대기 1번입니다.',controls='',out='빈자리를 만들어 두 결과를 비교해 보세요.';
 if(s==='ready')controls=button('빈자리 만들기','simulate',mode+':open','primary full');
 if(s==='offered'){title='지수님, 참여하시겠어요?';help='지수가 수락하기 전에는 예약하지 않아요.';controls=button('참여할게요','simulate',mode+':accept','primary full')+button('지금은 어려워요','simulate',mode+':decline','quiet full');out='기회는 지수에게 · 예약은 아직 0명';}
 if(s==='booked'){title='지수님, 예약되었어요';help=mode==='A'?'다시 누르지 않아도 자리가 확보됐어요.':'참여 의사를 확인한 뒤 자리가 확보됐어요.';controls=button('예약 확인하기','simulate',mode+':view','primary full')+button('지금은 어려워요','simulate',mode+':decline','quiet full');out='예약 1명 · 남은 자리 0';}
 if(s==='viewed'){title='지수님의 예약';help='목요일 19:00 · 저녁 요가에서 만나요.';controls=button('지금은 어려워요','simulate',mode+':decline','quiet full');out='두 방식 모두 참석할 수 있을 때는 예약으로 이어져요.';}
 if(s==='passed'){title=mode==='A'?'민호님, 예약되었어요':'민호님, 참여하시겠어요?';help='지수가 거절해 다음 차례로 넘어갔어요.';controls=mode==='B'?button('민호가 참여할게요','simulate',mode+':second','primary full'):button('민호의 예약 확인','simulate',mode+':second','primary full');out=mode==='A'?'민호 예약 · 지수 예약 없음':'민호에게 기회 · 예약은 아직 0명';}
 if(s==='second'){title='민호님의 예약';help='대기 순서가 이어져 민호가 참여합니다.';out='예약 1명 · 남은 자리 0';}
 return `<div class="phone" aria-label="${mode}안 고객 화면"><div class="phone-bar"><span class="phone-brand">MONO</span><span>회원 화면 · 모의</span></div><div class="phone-card"><span class="muted" style="font-size:10px">목요일의 작은 루틴</span><div class="class-title">저녁 요가</div><div class="class-time">목요일 19:00 – 20:00</div><div class="phone-state">${title}</div><div class="phone-help">${help}</div><div class="phone-actions">${controls}</div></div><div class="scenario-outcome">${out}</div></div>`;

function criteriaHTML(){const c=state.choice;return `<ul class="criteria"><li><span class="marker">${icon(c?.kind==='defer'?'clock':'check')}</span><div><strong>${esc(choiceSummary())}</strong><p>${c?.kind==='custom'?'직접 적은 조건을 그대로 전달해요. 시제품이 의미를 해석하거나 구현 가능성을 확인한 것은 아닙니다.':c?.kind==='defer'?'건너뛴 것을 동의로 처리하지 않습니다. 이 조건이 필요한 구현은 확인 후 진행하도록 전달해요.':esc(modeRule(c?.kind,c?.priority))}</p></div>${tag(originLabel(),c?.kind==='defer'?'amber':'green')}</li><li><span class="marker">${icon('branch')}</span><div><strong>대기 순서 ${c?.priority==='fast'?'대신 응답 순서':'유지'}</strong><p>${esc(priorityRule(c?.priority))}</p></div>${tag(c?.kind==='custom'||c?.kind==='defer'?'예시 조건':'함께 고른 조건')}</li><li><span class="marker hold">${icon('clock')}</span><div><strong>${c?.kind==='A'?'대기 의사 재확인 시점은 미정':'미응답을 기다릴 시간은 미정'}</strong><p>${c?.kind==='A'?'오래된 대기를 계속 유효하게 볼지 아직 정하지 않았어요.':'일정 시간이 지나면 자동으로 넘길지, 얼마나 기다릴지는 정하지 않았어요.'} 이 값은 임의로 채우지 않아요.</p></div>${tag('미정','amber')}</li></ul>`;}
function handoffText(){const c=state.choice;const status=c?.kind==='defer'?'보류':c?.kind==='custom'?'직접 입력·자동 비교 미지원':originLabel();return `# 모노 요가 · 이번 개발 기준 (체험용)\n기준 D-01 v${state.revision} / ${status}\n\n[원래 요청 — 자유입력은 자동 분석하지 않음]\n${state.input}\n\n[이번 기준]\n${choiceSummary()}\n${c?.kind==='custom'||c?.kind==='defer'?'예약 방식의 A/B 의미를 추측하지 말 것.':modeRule(c?.kind,c?.priority)}\n${priorityRule(c?.priority)}${c?.kind==='custom'||c?.kind==='defer'?' (대기 순서는 제공된 예시 조건이며 별도 확인 필요)':''}\n${state.skipped&&c?.origin==='provided'?'이번 작업은 버튼 문구 변경뿐. 위 기존 기준은 제공된 예시이며 새 사용자 승인으로 취급하지 말 것.\n':''}\n[확인할 장면]\n목요일 19시 수업에 1자리. 지수는 대기 1번, 민호는 2번.\n${c?.priority==='fast'?'전체 대기자에게 안내하되 수락 전 예약 0명.':c?.kind==='B'?'지수에게 먼저 안내하되 수락 전 예약 0명, 수락 후 지수 예약 1명.':c?.kind==='A'?'빈자리가 나면 별도 수락 없이 지수 예약 1명.':'예약 확정 방식이 미정/사용자 서술이므로 예상 결과를 먼저 확인할 것.'}\n${c?.priority==='fast'?'민호가 먼저 수락한 경우 민호 예약 1명.':'지수가 거절하면 민호에게 차례를 넘길 것.'}\n\n[남은 결정]\n${c?.kind==='A'?'대기 의사를 다시 확인할 시점 미정.':'미응답 처리와 대기 시간 미정. 타임아웃 값을 만들지 말 것.'}\n${c?.kind==='defer'?'예약 확정 방식은 보류. 화면·문구 초안은 가능하나 실제 자동 예약은 기준 확인 전 진행하지 말 것.\n':''}\n[추가로 남긴 말 — 원문 그대로]\n${state.notes||'(없음)'}\n\n[경계]\n이 문서는 전달용 초안이며 실행/검증 결과가 아님. 실제 개발 도구에 자동 전송되지 않음.\n실제 예약·발송·외부 환불·삭제·배포는 승인되지 않음. 이 체험의 선택으로 실행 권한을 확대하지 말 것.\n실제 코드·실제 앱 동작은 미확인. 위 장면과 별도로 필요한 테스트를 수행할 것.\n`;}

function prepareReview(){const known=isKnown();const r={baseRevision:state.revision,baseChoice:structuredClone(state.choice),fixture:state.skipped?'match':'drift',played:false,resolution:null,corrected:false,acceptedRevision:null};r.actual=makeActual(r.fixture,r.baseChoice);state.review=r;state.next=null;}
function makeActual(fixture,base){if(base?.priority==='fast'&&fixture!=='match')return {kind:'B',priority:'fifo'};let kind=base?.kind;if(!['A','B'].includes(kind))kind='A';else if(fixture!=='match')kind=kind==='A'?'B':'A';return{kind,priority:base?.priority||'fifo'};}
function resultSnippet(kind,priority='fifo',isNext=false){if(!['A','B'].includes(kind))return `<strong>기대하는 결과는 미정입니다.</strong><div class="event-log"><span class="event-dot"></span>준비된 예시와 자동으로 일치/불일치를 판정하지 않아요.</div>`;if(priority==='fast')return `<strong>민호가 먼저 수락 → 민호 예약</strong><div class="event-log"><span class="event-dot"></span>모두에게 동시에 안내합니다.</div><div class="event-log"><span class="event-dot"></span>지수는 먼저 대기했지만, 민호가 먼저 응답했어요.</div>`;return kind==='A'?`<strong>지수에게 예약 완료 안내</strong><div class="event-log"><span class="event-dot"></span>빈자리 발생 → 지수 예약 1명</div><div class="event-log"><span class="event-dot"></span>지수의 추가 수락은 필요하지 않아요.</div>`:`<strong>지수에게 참여 의사 확인</strong><div class="event-log"><span class="event-dot"></span>빈자리 발생 → 예약은 아직 0명</div><div class="event-log"><span class="event-dot"></span>지수가 수락 → 지수 예약 1명</div>`;}
function comparisonHTML(expected,actual,inference=false){return `<div class="comparison"><section class="comparison-side"><div class="comparison-label">기준 D-01 · 기대하는 장면</div><div class="comparison-title">${esc(modeTitle(expected?.kind))}</div><div class="mini-result">${resultSnippet(expected?.kind,expected?.priority)}</div></section><div class="comparison-arrow">${icon('arrow')}</div><section class="comparison-side actual"><div class="comparison-label">${inference?'동작 기록 없는 요약 · 모의':'미리 작성한 구현 결과 · 모의'}</div><div class="comparison-title">${inference?'“대기예약 처리 완료”':esc(modeTitle(actual.kind))}</div><div class="mini-result">${inference?`<strong>“예약 안내 로직을 추가했습니다.”</strong><div class="event-log"><span class="event-dot"></span>언제 예약되는지 보여주는 동작 기록은 없어요.</div>`:resultSnippet(actual.kind,actual.priority)}</div></section></div>`;}
function resultBanner(kind,title,text){return `<div class="result-banner ${kind}"><div class="result-icon">${icon(kind==='green'?'check':kind==='blue'?'info':'branch')}</div><div><strong>${title}</strong><p>${text}</p></div></div>`;}
function reviewPage(){

 const unknown=!['A','B'].includes(r.baseChoice?.kind); const inference=r.fixture==='summary'; const actual=currentActual(r);const match=!unknown&&!inference&&actual.kind===state.choice.kind&&actual.priority===state.choice.priority;

 if(!r.played){body+=`<div class="blank-stage">${icon('play')}<h3>같은 상황에서 결과를 살펴보세요</h3><p>${inference?'이 예시는 요약만 있고 동작 기록은 없습니다. 무엇을 판단할 수 없는지도 확인해 보세요.':'빈자리 발생 → 지수에게 안내 → 예약되는 시점을 나란히 보여줍니다.'}</p>${button(icon('play')+(inference?' 요약과 기준 비교':' 같은 장면 재생'),'play-review','','primary')}</div>`;}

 else if(unknown){body+=resultBanner('blue',r.baseChoice?.kind==='custom'?'직접 쓴 조건은 자동 대조하지 않았어요.':'아직 정하지 않은 내용이 예시에 들어 있어요.',r.baseChoice?.kind==='custom'?`입력한 조건: “${esc(r.baseChoice.text)}”<br>이 예시가 의도와 맞는지 직접 확인해야 합니다. 사용자 문장을 A/B로 임의 해석하지 않아요.`:'보류는 승인이 아닙니다. 준비된 예시는 바로 예약하지만, 이것을 원래 결정 위반이나 승인된 구현이라고 부르지 않아요.');body+=resolveButtons(true);}

}
function closeModal(){modalAction=null;$('#modal').close();}
function guide(){showModal('중요한 순간 하나로 이어가요.',`<p><strong>첫 사용자</strong><br>AI로 실제 회원이 쓸 수업 예약 앱을 만드는 1인 제작자입니다.</p><p><strong>이번 체험</strong><br>요청 → A/B 고객 화면 → 선택·직접 입력·보류 → 전달용 기준 → 모의 결과와 비교 → 수정 요청·의도된 변경·보류 → 다음 변경에서 재사용합니다.</p><div class="notice neutral"><strong>실제로 작동하는 것</strong><br>버튼·분기·기준 수정·탭 안 기록·복사·파일 내려받기<br><strong>하지 않는 것</strong><br>자유문장 AI 분석, 실제 코드 검사, 실제 앱 테스트, 도구 연동, 서버 저장, 실제 예약·발송</div><p>“문구만 바꾸기”는 새 결정 없이 통과합니다. “요약만 있는 예시”는 동작을 단정하지 않습니다.</p><p>수정 요청은 이미 발생한 환불·삭제 등을 되돌리지 않으며, 자주 선택해도 실행 권한은 늘어나지 않습니다. 새로고침하면 이 탭의 기록은 초기화됩니다.</p>`);}
async function copyText(kind){
 const text=kind==='repair'?repairText():kind==='next'?nextText():handoffText();
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('복사했어요. 개발 도구에는 직접 붙여넣어 주세요.');return;}}catch(_){/* file:// or denied permission: fall through to local selection. */}
 const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-10000px;top:0';document.body.appendChild(area);area.focus();area.select();let copied=false;try{copied=document.execCommand('copy');}catch(_){}area.remove();
 if(copied){toast('복사했어요. 실제 도구로 전송하지는 않았어요.');return;}
 showModal('직접 복사해 주세요.',`<p>이 브라우저에서 클립보드 접근을 허용하지 않았어요. 아래 내용을 선택해 복사할 수 있습니다.</p><label class="sr-only" for="manual-copy">복사할 내용</label><textarea id="manual-copy" readonly rows="12">${esc(text)}</textarea>`);$('#manual-copy').focus();$('#manual-copy').select();
}
function downloadText(kind){
 const text=kind==='next'?nextText():handoffText();const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=kind==='next'?'mono-next-change.md':`mono-criteria-v${state.revision}.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('파일 저장을 요청했어요. 실제 개발은 시작하지 않습니다.');
}
function focusResult(){const el=$('.result-banner')||$('#main');el.tabIndex=-1;el.focus({preventScroll:true});}
function acceptReview(){
 const r=state.review;const actual=r.actual;
 showModal('이 조건만 바꿀까요?',`<p>달라진 결과를 의도한 변경으로 받아들이면, 다음 비교에도 이 기준을 사용합니다.</p><div class="modal-diff"><span>이전 · D-01 v${state.revision}</span>${esc(choiceSummary())}<span>변경 후 · D-01 v${state.revision+1}</span>${esc(modeTitle(actual.kind))}<span>${actual.priority===state.choice.priority?'유지':'배정 기준도 변경'}</span>${esc(priorityRule(actual.priority))}</div><p>실제 구현의 동작을 확인한 것이 아닙니다. 다른 조건, 실제 실행 권한, 이후 변경의 자동 승인은 포함하지 않습니다.</p>`,'이 조건만 새 기준으로',()=>{
  state.revision++;state.choice={id:'D-01',kind:actual.kind,text:'',priority:actual.priority,origin:'user'};addHistory('모의 결과를 의도한 변경으로 선택',choiceSummary());r.resolution='accept';r.acceptedRevision=state.revision;state.next=null;closeModal();render();focusResult();toast('이 조건만 변경했어요. 실제 적용은 미확인입니다.');
 });
}
function acceptNext(){
 showModal('배정 기준이 달라집니다.',`<p>빠른 응답을 우선하는 요청입니다. 달라지는 고객 결과만 확인하세요.</p><div class="modal-diff"><span>이전</span>${esc(priorityRule(state.choice.priority))}<span>변경 후</span>모든 대기자에게 안내하고, 먼저 수락한 사람을 예약합니다.${state.choice.kind==='A'?'<span>함께 바뀌는 것</span>바로 예약 → 참여 수락 후 예약':''}</div><p>기존의 대기 순서 우선 기준을 이 요청에 한해 바꿉니다. 실제 발송·예약이나 다음 변경을 자동 승인하지 않습니다.</p>`,'이 변경을 새 기준으로',()=>{
 state.revision++;state.choice={id:'D-01',kind:'B',priority:'fast',text:'',origin:'user'};addHistory('다음 요청에서 배정 기준 변경',choiceSummary());state.next.resolution='accept';state.next.baseRevision=state.revision;closeModal();render();focusResult();toast('다음에도 사용할 기준을 바꿨어요. 실제 적용은 미확인입니다.');
 });
}
function setRoute(route){state.route=route;state.input=route==='copy'?copyRequest:initialRequest;render();}
document.addEventListener('input',event=>{const el=event.target;const field=el.dataset.field;if(!field)return;const limit=el.maxLength>0?el.maxLength:1000;state[field]=el.value.slice(0,limit);if(field==='notes'){if($('#handoff-text'))$('#handoff-text').value=handoffText();renderDetail();}});
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const value=el.dataset.value;
 switch(action){
 case 'nav': {const step=Number(value);if(Number.isInteger(step)&&step>=0&&step<=state.maxStep){if(state.step===0&&step>0&&!state.input.trim()){toast('요청을 한 줄 적어 주세요.');$('#request').focus();}else go(step);}break;}
 case 'dismiss':state.notice='';render();break;
 case 'guide':guide();break;
 case 'reset':showModal('이 체험을 처음부터 볼까요?','<p>이 탭의 입력, 선택, 모의 비교를 초기화합니다. 이미 내려받은 파일과 실제 프로젝트에는 영향을 주지 않습니다.</p>','체험 초기화',()=>{closeModal();state=fresh();render(true);toast('이 체험만 초기화했어요.');});break;
 case 'route':if(value===state.route)break;if(state.choice){showModal('다른 예시로 시작할까요?','<p>이 탭의 기존 선택과 비교는 초기화됩니다. 직접 남긴 추가 메모는 유지합니다. 실제 프로젝트는 바뀌지 않습니다.</p>','예시 바꾸기',()=>{const notes=state.notes;closeModal();state=fresh();state.notes=notes;setRoute(value);});}else setRoute(value);break;
 case 'start':{
  if(!state.input.trim()){toast('요청을 한 줄 적어 주세요.');$('#request').focus();break;}
  if(state.inputSnapshot!==null&&state.inputSnapshot!==state.input&&state.choice){state.revision++;addHistory('요청 원문 변경 · 자동 분석 없음',state.input);state.notice='요청 원문을 바꿨어요. 자유입력 의미는 분석하지 않으며, 이전 모의 결과는 다시 확인하도록 표시합니다.';state.next=null;}
  state.inputSnapshot=state.input;
  if(state.route==='copy'){state.skipped=true;if(!state.choice)applyChoice('B',{origin:'provided',source:'제공된 기존 기준(예시) 재사용',navigate:false});go(2);}else{state.skipped=false;go(1);}break;
 }
 case 'simulate':{
  const [m,eventName]=value.split(':');const next={open:m==='A'?'booked':'offered',accept:'booked',view:'viewed',decline:'passed',second:'second'}[eventName];if(next){state.scene[m]=next;render();const card=document.querySelectorAll('.option')[m==='A'?0:1];const label=card.querySelector('.phone-state');label.tabIndex=-1;label.focus({preventScroll:true});announce(`${m}안: ${label.textContent}`);}break;
 }
 case 'reset-scenes':state.scene={A:'ready',B:'ready'};render();toast('두 화면의 고객 상황만 초기화했어요. 선택한 기준은 유지됩니다.');break;
 case 'choose':applyChoice(value);toast(`${value}안의 조건을 이 탭의 기준으로 정했어요.`);break;
 case 'custom':showModal('두 안에 없는 의도를 적어주세요.',`<p>한 문장이면 됩니다. 그대로 전달하며, 시제품이 A/B로 자동 해석하지 않습니다.</p><label class="field-label spaced" for="custom-input">원하는 결과</label><textarea id="custom-input" maxlength="1000" data-field="draftCustom" placeholder="예: 운영자가 전화로 참석을 확인한 뒤 직접 예약하고 싶어요.">${esc(state.draftCustom||state.choice?.text||'')}</textarea><p class="field-hint">이 조건은 직접 입력으로 기록합니다. 결과의 자동 일치 판정은 하지 않습니다.</p>`,'내 조건으로 이어가기',()=>{const text=$('#custom-input').value.trim();if(!text){toast('원하는 결과를 적거나, 취소 후 보류할 수 있어요.');$('#custom-input').focus();return;}state.draftCustom=text;closeModal();applyChoice('custom',{text,source:'A/B 대신 직접 입력'});toast('직접 적은 조건을 그대로 남겼어요.');});break;
 case 'defer':applyChoice('defer',{source:'예약 방식 보류'});toast('보류했어요. 예시를 자동 승인하지 않습니다.');break;
 case 'detail':state.detail=state.detail===value?null:value;renderDetail();if(state.detail&&window.innerWidth<1251)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'close-detail':state.detail=null;renderDetail();break;
 case 'open-review':if(!state.review)prepareReview();go(3);break;
 case 'refresh-review':prepareReview();state.notice='';render();toast('현재 기준으로 모의 결과를 다시 준비했어요.');break;
 case 'fixture':if(!state.review||state.review.resolution)break;state.review.fixture=value;state.review.actual=makeActual(value,state.review.baseChoice);state.review.played=false;state.review.corrected=false;state.next=null;render();break;
 case 'play-review':state.review.played=true;render();focusResult();announce('준비된 모의 장면의 비교 결과를 열었어요.');break;
 case 'resolve':if(value==='accept'){acceptReview();break;}state.review.resolution=value;addHistory(value==='repair'?'수정 요청 초안':value==='verify'?'근거 부족 · 확인 요청':'모의 결과 판단 보류',value==='repair'?'기준 유지 · 실제 반영 미확인':value==='verify'?'가능성만 기록 · 실제 동작 미확인':'기준 유지 · 차이 해결 미확인');state.next=null;render();focusResult();break;
 case 'correct-preview':state.review.corrected=true;addHistory('수정 반영 예시 열람','모의 장면만 일치 · 실제 수정 미확인');render();focusResult();break;
 case 'undo-resolution':state.review.resolution=null;state.review.corrected=false;state.next=null;addHistory('직전 판단 다시 검토','이전 판단은 기록으로만 남음');render();focusResult();break;
 case 'open-next':if(!state.next)prepareNext();go(4);break;
 case 'next-type':if(state.next.resolution==='accept'){showModal('이전 모의 결과부터 다시 준비해요.','<p>새 배정 기준으로 바뀌었으므로, 예전 결과를 재사용하지 않습니다. 현재 기준으로 모의 비교를 다시 준비한 뒤 다른 요청을 볼 수 있어요.</p>','현재 기준으로 비교하기',()=>{closeModal();prepareReview();go(3);});}else{state.next.type=value;state.next.played=false;state.next.resolution=null;render();}break;
 case 'play-next':state.next.played=true;render();focusResult();break;
 case 'next-correct':state.review.corrected=true;state.next.played=true;addHistory('다음 요청에서 수정 반영 예시 열람','실제 수정 여부는 여전히 미확인');render();focusResult();break;
 case 'next-resolve':if(value==='accept'){acceptNext();break;}state.next.resolution=value;addHistory(value==='preserve'?'다음 요청의 수정 초안':'다음 요청 보류','현재 기준 유지 · 실제 적용 미확인');render();focusResult();break;
 case 'undo-next':state.next.resolution=null;render();focusResult();break;
 case 'copy':copyText(value).catch(()=>toast('복사하지 못했어요. 펼친 내용을 직접 선택해 주세요.'));break;
 case 'download':downloadText(value);break;
 case 'close-modal':closeModal();break;
 case 'confirm-modal':if(modalAction)modalAction();break;
 }
});
$('#modal').addEventListener('cancel',()=>{modalAction=null;});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
render();
</script>
</body>
</html>
