name: Verify app and continuity (no paid AI)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    env:
      AI_MODE: mock
      ALLOW_PAID_AI: 'false'
      DEEPSEEK_API_KEY: ''
      BROWSER_TRANSPORT: direct-http
      EVIDENCE_DIR: test-results
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      # Pinned actions; checkout explicitly targets the reported PR head SHA.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - name: Record exact runtime and checked-out commit
        shell: bash
        run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/commit.txt
          node --version | tee test-results/node.txt
          npm --version | tee test-results/npm.txt
          node -e "if(process.version !== 'v22.16.0') process.exit(1)"
      - name: Clean locked install
        shell: bash
        run: |
          mkdir -p test-results
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee test-results/install.log
      - name: Type and boundary checks
        shell: bash
        run: npm run check 2>&1 | tee test-results/check.log
      - name: Build and domain / HTTP / simulated provider tests
        shell: bash
        run: npm test 2>&1 | tee test-results/node-tests.tap
      - name: Continuity type, syntax and credential boundary checks
        shell: bash
        run: node continuity/scripts/check.mjs 2>&1 | tee test-results/continuity-check.log
      - name: Build and test continuity with simulated providers
        shell: bash
        run: |
          node continuity/scripts/build.mjs 2>&1 | tee test-results/continuity-build.log
          node --test continuity/tests/*.test.mjs 2>&1 | tee test-results/continuity-node-tests.tap
      - name: Build static site (no AI server bundled, no credentials)
        shell: bash
        run: |
          set -o pipefail
          node continuity/scripts/build-static.mjs 2>&1 | tee test-results/static-build.log
      - name: Install pinned browser verification tools
        run: |
          python -m pip install -r tests/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Direct browser-to-server verification (original app, AI is still mocked)
        shell: bash
        run: python tests/browser.py 2>&1 | tee test-results/browser-direct.log
      # The earlier continuity browser suites asserted the replaced UI's coordinates and DOM; they were retired with that UI.
      # Data preservation, receipt and key boundaries stay covered by the node tests above (incl. studio.test.mjs).
      - name: Studio smoke - entry, map, part, ask, failure/retry, no-key and static states (stubbed provider, no real key)
        shell: bash
        run: |
          set -o pipefail
          python continuity/tests/studio_browser.py 2>&1 | tee test-results/studio-browser.log
      - name: Upload only this run's results, not historic snapshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentflow-${{ matrix.os }}-${{ github.run_id }}
          path: app/test-results/
          if-no-files-found: warn
          retention-days: 7
